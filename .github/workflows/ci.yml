name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · formato, lint, tipos, float y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Sincronizar dependencias
        run: uv sync --locked --python 3.14
      - name: Formato con Ruff
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .
      - name: Lint con Ruff
        if: ${{ !cancelled() }}
        run: uv run ruff check .
      - name: Tipos con mypy
        if: ${{ !cancelled() }}
        run: uv run mypy .
      - name: Regla de float en el dominio
        if: ${{ !cancelled() }}
        run: uv run python -m herramientas.verificar_float
      - name: Pruebas con cobertura
        if: ${{ !cancelled() }}
        run: uv run pytest --cov=cimenta --cov=tipos_base --cov=contrato_error --cov=servidor --cov-report=term --cov-report=xml:cobertura.xml --junitxml=pytest.xml
      - name: Publicar informe de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-pruebas
          path: |
            backend/cobertura.xml
            backend/pytest.xml
          if-no-files-found: error
          retention-days: 14

  fronteras:
    name: Fronteras entre módulos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Sincronizar dependencias
        run: uv sync --locked --python 3.14
      - name: Contratos de importación
        run: uv run lint-imports

  contrato-api:
    name: Prueba de contrato de la API · reservado para TKT-061
    needs: backend
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reservado para TKT-061
        run: 'echo "Reservado para TKT-061: sin contenido todavía."'

  frontend:
    name: Frontend · lint, tipos, pruebas y tipos generados
    needs: contrato-api
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sincronizar dependencias del backend
        working-directory: backend
        run: uv sync --locked --python 3.14
      - name: Instalar dependencias del cliente
        working-directory: frontend
        run: npm ci
      - name: Lint del cliente
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run lint
      - name: Tipos de TypeScript
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run typecheck
      - name: Pruebas del cliente
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm test
      - name: Tipos generados al día
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run tipos:verificar

  humo:
    name: Humo · recorrido de Playwright con base migrada
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Copiar la configuración de ejemplo
        run: cp .env.example .env
      - name: Levantar PostgreSQL
        run: docker compose up -d --wait db
      - name: Sincronizar dependencias del backend
        working-directory: backend
        run: uv sync --locked --python 3.14
      - name: Migrar el esquema
        working-directory: backend
        run: uv run --env-file ../.env alembic upgrade head
      - name: Fijar contraseñas de los roles
        working-directory: backend
        run: uv run --env-file ../.env python -m herramientas.contrasenas_roles
      - name: Instalar dependencias del cliente
        working-directory: frontend
        run: npm ci
      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Recorrido de humo
        working-directory: frontend
        run: npm run e2e -- --reporter=list,html
      - name: Publicar informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: humo-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  herramientas:
    name: Herramientas · pruebas de tools/
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Sincronizar dependencias del backend
        working-directory: backend
        run: uv sync --locked --python 3.14
      - name: Pruebas de tools/
        shell: bash
        run: uv run --no-project --python 3.14 python -m unittest discover -s tools/tests 2>&1 | tee "$RUNNER_TEMP/tools.txt"
      - name: Guarda contra pruebas saltadas
        run: |
          ! grep -q "skipped=" "$RUNNER_TEMP/tools.txt"

  workflows:
    name: Seguridad de los workflows · zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Auditar los workflows con zizmor 1.31.1
        run: uvx zizmor@1.31.1 --offline .github/workflows

  documentacion:
    name: Documentación · verificador propio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar la documentación
        run: python3 tools/verificar_docs.py

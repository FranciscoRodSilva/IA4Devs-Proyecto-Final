# Actualizaciones automáticas de dependencias (RNF-08, TKT-009b).
# Una entrada por ecosistema, cada una semanal: Python en /backend (lock de uv), npm en /frontend
# (package-lock.json) y las acciones de GitHub de los workflows en /.
# Si GitHub rechaza el ecosistema "uv" en esta versión, se sustituye por "pip" en la misma entrada
# (diseño de TKT-009): el directorio y el intervalo no cambian.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

# Almacén de objetos local de CIMENTA (TKT-059): MinIO, compatible con S3 como R2.
# Va en un archivo aparte, sin perfil, para que `docker compose up -d db` no lo cargue ni
# interpole sus variables (la VPS y un `.env` anterior a TKT-059 no las traen). Se usa con los dos:
#   docker compose -f compose.yaml -f compose.almacen.yaml up -d minio
# Imagen: fork comunitario pgsty/minio, que sustituye a minio/minio (ya no se descarga).
# Digest de la etiqueta: sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
# Comparte proyecto con compose.yaml mediante el mismo `name`.
name: cimenta

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CIMENTA_ALMACEN_CLAVE_ACCESO:?define CIMENTA_ALMACEN_CLAVE_ACCESO en .env}
      MINIO_ROOT_PASSWORD: ${CIMENTA_ALMACEN_CLAVE_SECRETA:?define CIMENTA_ALMACEN_CLAVE_SECRETA en .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CIMENTA_SPA_ORIGEN:-http://localhost:5173}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_datos:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  minio_datos:

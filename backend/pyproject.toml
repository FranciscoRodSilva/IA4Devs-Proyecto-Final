[project]
name = "cimenta"
version = "0.1.0"
description = "Backend de CIMENTA: control de costos de obra."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.159.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF032"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
exclude = ['^\.venv/']

[[tool.mypy.overrides]]
module = ["cimenta.*.dominio.*", "cimenta.auditoria.*", "tipos_base.*", "contrato_error.*", "servidor.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
implicit_reexport = false

[tool.fastapi]
entrypoint = "servidor.principal:app"

[tool.importlinter]
root_packages = ["cimenta", "tipos_base"]
include_external_packages = true
exclude_type_checking_imports = false
contract_types = ["lista_blanca: herramientas.contrato_lista_blanca.ContratoListaBlanca"]

[[tool.importlinter.contracts]]
id = "esqueleto-modulos"
name = "cimenta tiene exactamente los diez módulos de arquitectura §5"
type = "layers"
containers = ["cimenta"]
layers = [
    "identidad : auditoria : archivos : presupuesto : compras : almacen : avance : personal : proveedores : analitica",
]
exhaustive = true
broken_contract_guidance = "Un módulo nuevo o renombrado se decide en un ticket y se documenta en docs/02-arquitectura.md §5 en el mismo cambio."

[[tool.importlinter.contracts]]
id = "esqueleto-capas"
name = "Cada módulo tiene sus cuatro capas y una sola interfaz, y su dominio no importa las otras"
type = "layers"
containers = ["cimenta.*"]
layers = [
    "api : aplicacion : infraestructura : interfaz",
    "dominio",
]
exhaustive = true
broken_contract_guidance = "La estructura de un módulo está en docs/02-arquitectura.md §6, y dominio/ no importa nada de su módulo (regla 2 de CLAUDE.md)."

[[tool.importlinter.contracts]]
id = "dominio-sin-framework"
name = "dominio/ solo importa la biblioteca estándar y tipos_base, ni directa ni indirectamente"
type = "lista_blanca"
origen = ["cimenta.*.dominio"]
permitidos = ["tipos_base"]
broken_contract_guidance = "El dominio es Python puro (docs/adr/20260918-dominio-puro.md): solo la biblioteca estándar y tipos_base. No se arregla con una excepción en el contrato."

[[tool.importlinter.contracts]]
id = "tipos-base-puro"
name = "tipos_base solo importa la biblioteca estándar, ni directa ni indirectamente"
type = "lista_blanca"
origen = ["tipos_base"]
broken_contract_guidance = "tipos_base lo importan todos los módulos: no puede depender de ninguno ni de un tercero."

[[tool.importlinter.contracts]]
id = "solo-por-interfaz"
name = "Un módulo usa a otro solo por cimenta.<modulo>.interfaz"
type = "forbidden"
source_modules = ["cimenta.*"]
forbidden_modules = [
    "cimenta.*.api",
    "cimenta.*.aplicacion",
    "cimenta.*.dominio",
    "cimenta.*.infraestructura",
]
allow_indirect_imports = true
broken_contract_guidance = "Otro módulo se usa solo por su interfaz (docs/adr/20260918-monolito-modular.md). No se arregla con una excepción en el contrato."

[[tool.importlinter.contracts]]
id = "grafo-identidad"
name = "Quién puede importar identidad"
type = "protected"
protected_modules = ["cimenta.identidad"]
allowed_importers = ["cimenta.archivos", "cimenta.presupuesto", "cimenta.compras", "cimenta.almacen", "cimenta.avance", "cimenta.personal", "cimenta.proveedores", "cimenta.analitica"]
as_packages = true
broken_contract_guidance = "La arista no está en el grafo de docs/02-arquitectura.md §5. Una arista nueva la decide el usuario y se añade aquí y en §5 en el mismo cambio."


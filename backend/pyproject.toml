[tool.alembic]
script_location = "%(here)s/migraciones"
prepend_sys_path = ["."]
file_template = "v%%(rev)s_%%(slug)s"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

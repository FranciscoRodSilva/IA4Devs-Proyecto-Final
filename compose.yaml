# PostgreSQL local de CIMENTA (TKT-003). El backend y el frontend corren en el anfitrión.
# El usuario de la imagen es el rol de migración; los otros dos los crea la migración.
# El almacén de objetos (MinIO, TKT-059) está en compose.almacen.yaml, que se suma con
# `docker compose -f compose.yaml -f compose.almacen.yaml up -d minio`.
name: cimenta

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: cimenta_migracion
      POSTGRES_PASSWORD: ${CIMENTA_DB_CONTRASENA_MIGRACION:?define CIMENTA_DB_CONTRASENA_MIGRACION en .env}
      POSTGRES_DB: ${CIMENTA_DB_NOMBRE:?define CIMENTA_DB_NOMBRE en .env (copia .env.example)}
    ports:
      - "127.0.0.1:${CIMENTA_DB_PUERTO:-5432}:5432"
    volumes:
      - pg_datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimenta_migracion -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pg_datos:

  /entradas-almacen:
    post:
      tags: [almacen]
      operationId: registrar_entrada_almacen
      summary: Registra una entrada de material contra la remisión del proveedor
      description: >-
        En línea en la fase 1; la captura diferible sin conexión es TKT-068 (fase 2),
        y entonces esta misma ruta acepta el `id` generado por el cliente y
        `capturado_en` (TKT-064), sin ruta de sincronización propia. Toma
        `SELECT … FOR UPDATE` sobre **`orden_compra` primero** y después sobre sus
        renglones ordenados por id, valida con `RN-05`, `RN-06` y `RN-07` en
        `dominio/`, copia el `proveedor_id` de la orden, escribe un movimiento
        `ENTRADA` por renglón en el libro mayor y **deriva** el estado de la orden.


        - Sin folio de remisión → `422` citando `RN-05` (esc. 4).

        - Entrante mayor que el saldo → `409` `RN-07` con ordenado, recibido, saldo
        y excedente, y la acción `SOLICITAR_AUTORIZACION`. Nada se escribe y el
        saldo queda intacto (esc. 5).

        - Orden `CERRADA` o `CANCELADA` → `409` `ORDEN_NO_ADMITE_ENTRADAS` con el
        estado actual (esc. 6).

        - Folio repetido del mismo proveedor → `409` `FOLIO_REMISION_DUPLICADO` con
        la entrada previa (esc. 7).

        - Vence `lock_timeout` → `409` `CONCURRENCIA`.


        **Entrada con excedente autorizado** (`RN-07`, `PA-16`, resuelta el
        2026-10-17). Un renglón puede citar `solicitud_autorizacion_id`, una
        solicitud `EXCEDE_ORDENADO` `AUTORIZADA` de ese mismo renglón. `almacen`
        la valida por la interfaz de aplicación de `compras`, nunca por su tabla.
        El servidor admite hasta `saldo + cantidad excedente autorizada`, **suma
        el excedente a la recepción**, marca el renglón de la entrada con
        `excedente` —lo que pasó del saldo— e incrementa
        `cantidad_excedente_autorizada` del renglón de la orden. La orden queda
        `CERRADA`: lo ordenado quedó cubierto. El excedente es costo ejercido:
        entra al libro mayor como cualquier `ENTRADA` y, por tanto, al
        `consumido`. La solicitud se consume una sola vez (esc. 21).


        - Solicitud `PENDIENTE` o `RECHAZADA`, o excedente mayor que el autorizado
        → `409` `RN-07` con las mismas cifras y nada se registra (esc. 22).

        - Solicitud de otro renglón, de otro motivo o ya consumida por otra
        entrada → `409` `CONFLICTO` `SOLICITUD_NO_APLICABLE`, nada se registra.

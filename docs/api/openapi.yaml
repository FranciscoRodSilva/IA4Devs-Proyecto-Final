    post:
      tags: [compras]
      operationId: resolver_solicitud_autorizacion
      summary: Autoriza o rechaza una solicitud, con motivo obligatorio en ambos casos
      description: >-
        Para `EXCEDE_PRESUPUESTO` (`RN-03`), autorizar pasa la requisición de
        `BLOQUEADA` a `AUTORIZADA`; rechazar, a `RECHAZADA`. Ambas se asientan en
        la bitácora con motivo y regla.


        Para `EXCEDE_ORDENADO` (`RN-07`), autorizar **habilita** la entrada con
        excedente, pero **no la registra**: la solicitud pasa a `AUTORIZADA`, se
        asienta con `RN-07` y la orden no cambia. Almacén reenvía después la
        entrada a `registrar_entrada_almacen` citando la solicitud, y es esa
        entrada la que suma el excedente a la recepción e incrementa
        `cantidad_excedente_autorizada` del renglón (`PA-16`, resuelta el
        2026-10-17). Una autorización que nunca se usa no altera la orden.
        Rechazar la deja `RECHAZADA` y la entrada excedente no se admite.


        - Sin motivo → `422` (esc. 6).

        - Sin el rol `DIRECCION_GENERAL` → `403` `ROL_INSUFICIENTE` (esc. 7).

        - Sobre una solicitud propia → `403` `AUTO_RESOLUCION`: nadie resuelve lo
        suyo, comprobado en `dominio/` (esc. 8).

        - Ya resuelta → `409` `YA_RESUELTA` con quién y cuándo (esc. 9).

        - Sin efecto → `409` `SOLICITUD_SIN_EFECTO` (esc. 10).


        Los tres rechazos de permiso y estado se asientan en la bitácora; los `403`,
        como `DENEGAR` en una transacción propia, porque no hay cambio que
        acompañar.

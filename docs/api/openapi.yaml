    post:
      tags: [presupuesto]
      operationId: crear_importacion
      summary: Registra una importación y emite la URL de subida del Excel
      description: >-
        En **una transacción** crea la importación en `RECIBIDO` y su `archivo` en
        `PENDIENTE` (`referencia_tipo = IMPORTACION`), y devuelve la URL prefirmada
        de escritura. El navegador sube el Excel directo al almacén; el API nunca
        recibe los bytes (ADR-016). La importación **no arranca** hasta que el
        archivo esté `DISPONIBLE` y se pida el análisis.


        Antes de crear nada se rechaza con `422` lo que ya se sabe inválido por la
        declaración: extensión o tipo declarado distinto de `.xlsx` —**solo
        `.xlsx`**, no `.xls`— o tamaño declarado mayor que el límite (HDU-001
        esc. 21). Lo que solo se sabe leyendo los bytes se rechaza al confirmar el
        archivo con `409` (esc. 25 y 26), y una hoja sin filas de concepto deja la
        importación en `CON_ERRORES` con `SIN_CONCEPTOS` al analizarla (esc. 27).

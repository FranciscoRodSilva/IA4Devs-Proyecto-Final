      summary: Emite la orden de compra de una requisición EVALUADA o AUTORIZADA
      description: >-
        Copia los renglones de la requisición, hereda obra y tipo de partida, nace en
        `ABIERTA` con folio único consecutivo y pasa la requisición a `CONVERTIDA`.
        Si la requisición estaba `AUTORIZADA`, la orden conserva la referencia a la
        solicitud que la habilitó. Una requisición origina **como mucho una** orden.


        - Requisición `BLOQUEADA` → `409` `CONFLICTO` `ESTADO_NO_PERMITE_OPERACION`
        con la acción `VER_SOLICITUD_AUTORIZACION`. **No lleva regla ni se asienta
        como `RN-03`**: la regla ya se evaluó al bloquearla, y contarlo otra vez
        inflaría la consulta de excepciones (HDU-004 esc. 6).

        - Requisición `RECHAZADA` → `409` `ESTADO_NO_PERMITE_OPERACION`.

        - Ya `CONVERTIDA` → `409` `ORDEN_YA_EMITIDA` con el folio existente.

        - Sin proveedor → `422`. Proveedor que no está `ACTIVO` → `409` `PROVEEDOR_INACTIVO`.
        `compras` lo comprueba por el puerto `CatalogoProveedores`, que implementa
        `proveedores`: `orden_compra.proveedor_id` no tiene clave foránea.
      security:
        - sesion: []
          csrf: []

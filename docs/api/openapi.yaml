        - sesion: []
          csrf: []
      x-roles: [DIRECTOR_PROYECTOS]
      x-reglas: [RN-01]
      x-escenarios: ['HDU-001 esc. 4', 'HDU-001 esc. 21', 'HDU-001 esc. 24']

    TipoMovimiento:
      type: string
      enum: [ENTRADA, SALIDA, TRASPASO_SALIDA, TRASPASO_ENTRADA, MERMA, AJUSTE]
      description: En la fase 1 solo nacen `ENTRADA` y `AJUSTE`; el resto se contempla desde ya (v1.1).
    EntradaNueva:
      type: object
      required: [orden_compra_id, folio_remision, fecha_remision, renglones]
      properties:
        orden_compra_id:
          $ref: '#/components/schemas/Uuid'
        folio_remision:
          type: string
          minLength: 1
          description: Obligatorio (`RN-05`). Ausente o vacío, `422` con la regla citada.
          examples: [R-4521]
        fecha_remision:
          $ref: '#/components/schemas/Fecha'
        renglones:
          type: array
          minItems: 1
          items:
            type: object

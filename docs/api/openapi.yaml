  /obras/{obra_id}/semaforo/partidas/{tipo_partida_id}:
    parameters:
      - $ref: '#/components/parameters/ObraId'
      - $ref: '#/components/parameters/TipoPartidaId'
    get:
      tags: [analitica]
      operationId: obtener_desglose_partida
      summary: Desglose de un tipo de partida por fuente, por insumo y por ubicación
      description: >-
        Responde cuánto aporta cada fuente al ejercido (HDU-006 esc. 4) y abre la
        partida por ubicación —**por nivel y por área**—, que se consulta pero no
        es el nivel de control (esc. 13). Las cifras simuladas viajan con su
        `fuente` y nunca se suman a las reales.
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS]
      x-reglas: [RN-21]
      x-escenarios: ['HDU-006 esc. 4', 'HDU-006 esc. 13', 'HDU-006 esc. 14']
      x-tickets: [TKT-040]
      responses:
        '200':
          description: El desglose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesglosePartida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /obras/{obra_id}/semaforo/partidas/{tipo_partida_id}/movimientos:
    parameters:
      - $ref: '#/components/parameters/ObraId'
      - $ref: '#/components/parameters/TipoPartidaId'
    get:
      tags: [analitica]
      operationId: listar_movimientos_partida
      summary: Movimientos que componen el ejercido de una partida, hasta su documento de origen
      description: >-
        Cada movimiento lleva fecha, tipo, cantidad, unidad, importe, responsable,
        el motivo si es un `AJUSTE`, y `documento_origen` con la ruta para navegar
        hasta la entrada de almacén (HDU-006 esc. 7). Los movimientos de una fuente
        `SIMULADA` no tienen documento de origen y viajan marcados. La parte de
        nómina del escenario es de la fase 2.
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS]
      x-reglas: [RN-21]
      x-escenarios: ['HDU-006 esc. 7']
      x-tickets: [TKT-040]
      parameters:
        - name: fuente
          in: query
          schema:
            type: string
            enum: [MATERIALES, DESTAJO]
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de movimientos, el más reciente primero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaMovimientosPartida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /semaforo/alertas:
    get:
      tags: [analitica]
      operationId: listar_alertas_semaforo
      summary: Resumen de alertas de todas las obras activas
      description: >-
        Las partidas en `ROJO`: desviación relativa por encima de
        `obra.umbral_alerta_pct`, o cualquier desviación positiva si la obra no
        tiene umbral (HDU-006 esc. 11, F7.3; `PA-18`, resuelta el 2026-10-17).
        Una partida `AMARILLO` no aparece. Es lo único de la vista consolidada
        que entra en el MVP. **Excluye toda desviación ilustrativa**: una alerta
        calculada con una entrada `SIMULADA` no se emite.
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS]
      x-reglas: [RN-21]
      x-escenarios: ['HDU-006 esc. 11', 'HDU-006 esc. 16']
      x-tickets: [TKT-040]
      responses:
        '200':
          description: Alertas vigentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertaSemaforo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: cimenta_sesion
      description: >-
        Identificador opaco contra la tabla `sesion`; no lleva ningún dato del
        usuario. `HttpOnly`, `Secure`, `SameSite=Lax`. Ni JWT ni cookie firmada
        autocontenida (ADR-014).
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Token de doble envío: debe coincidir con la cookie `cimenta_csrf`. Obligatorio
        en todo método que muta estado (`RNF-05`); sin él o distinto, `403`
        `ORIGEN_NO_VERIFICADO`.

  headers:
    XCorrelacionId:
      description: >-
        Identificador de correlación de la petición (`RNF-13`). Viaja en toda
        respuesta y, en los errores, también en el cuerpo para que el usuario pueda
        citarlo.
      schema:
        $ref: '#/components/schemas/Uuid'
    Location:
      description: Ruta del recurso creado.
      schema:
        type: string
    RetryAfter:
      description: Segundos que conviene esperar antes de reintentar.
      schema:
        type: integer
        minimum: 0
    SetCookieSesion:
      description: '`cimenta_sesion=<id opaco>; HttpOnly; Secure; SameSite=Lax; Path=/`'
      schema:
        type: string
    SetCookieCsrf:
      description: '`cimenta_csrf=<token>; Secure; SameSite=Lax; Path=/` (sin `HttpOnly`)'
      schema:
        type: string

  parameters:
    ObraId:
      name: obra_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TipoPartidaId:
      name: tipo_partida_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ArchivoId:
      name: archivo_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ImportacionId:
      name: importacion_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LineaBaseId:
      name: linea_base_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RequisicionId:
      name: requisicion_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SolicitudId:
      name: solicitud_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProveedorId:
      name: proveedor_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrdenCompraId:
      name: orden_compra_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EntradaId:
      name: entrada_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Pagina:
      name: pagina
      in: query
      description: Número de página, desde 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    TamanoPagina:
      name: tamano_pagina
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Desde:
      name: desde
      in: query
      description: Límite inferior inclusivo.
      schema:
        $ref: '#/components/schemas/FechaHora'
    Hasta:
      name: hasta
      in: query
      description: Límite superior exclusivo.
      schema:
        $ref: '#/components/schemas/FechaHora'

  requestBodies:
    MotivoObligatorio:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Motivo'

  responses:
    NoAutenticado:
      description: Sin sesión, caducada o revocada; o credenciales inválidas al iniciar sesión.
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSesion'
          example:
            tipo: SESION
            motivo: SESION_REVOCADA
            mensaje: La sesión ya no es válida; inicia sesión de nuevo.
            correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
    SinPermiso:
      description: >-
        El usuario no tiene el rol, intenta resolver lo suyo, o la petición no trae
        prueba de origen. Nunca incluye importes del recurso.
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPermiso'
          example:
            tipo: PERMISO
            motivo: ROL_INSUFICIENTE
            mensaje: Recapturar el presupuesto de control requiere el rol de Dirección General.
            roles_requeridos: [DIRECCION_GENERAL]
            correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
    NoEncontrado:
      description: El recurso no existe.
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNoEncontrado'
    ErrorDeForma:
      description: >-
        La petición está mal formada: campo ausente, tipo incorrecto, cantidad no
        positiva, motivo vacío. Cuando la forma la impone una regla —`RN-02` para
        obra y tipo de partida, `RN-05` para el folio de remisión— el error del
        campo la cita.
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
          examples:
            sin_tipo_partida:
              summary: HDU-002 esc. 6
              value:
                tipo: VALIDACION
                mensaje: La petición tiene 1 campo inválido.
                errores:
                  - campo: tipo_partida_id
                    codigo: OBLIGATORIO
                    mensaje: No existe gasto sin centro de costos; la requisición necesita tipo de partida.
                    regla: RN-02
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            cantidad_no_positiva:
              summary: HDU-002 esc. 10
              value:
                tipo: VALIDACION
                mensaje: La petición tiene 1 campo inválido.
                errores:
                  - campo: renglones[1].cantidad
                    codigo: NO_POSITIVO
                    mensaje: La cantidad debe ser mayor que cero.
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            sin_remision:
              summary: HDU-005 esc. 4
              value:
                tipo: VALIDACION
                mensaje: La petición tiene 1 campo inválido.
                errores:
                  - campo: folio_remision
                    codigo: OBLIGATORIO
                    mensaje: La entrada se valida contra la remisión del proveedor, no contra la orden de compra.
                    regla: RN-05
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
    DemasiadosIntentos:
      description: Límite de intentos de acceso por cuenta o por origen (`RNF-04`). El bloqueo es temporal.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorLimiteIntentos'
    Conflicto:
      description: >-
        El estado actual impide la operación: una regla de negocio
        (`REGLA_NEGOCIO`), un conflicto de estado o unicidad sin regla propia
        (`CONFLICTO`) o un bloqueo que venció (`CONCURRENCIA`). El cliente los
        distingue por `tipo`.
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorConflicto'
    ConflictoSinPresupuesto:
      description: >-
        Sin línea base congelada o sin tope de control capturado: no hay contra qué
        evaluar. Es `CONFLICTO` con su propio `codigo`, nunca `RN-03`: no se violó
        la regla, y asentarlo con ella ensuciaría la consulta de excepciones.
        Como en todo rechazo, las `acciones` se filtran por los roles de quien
        llama: `CAPTURAR_PRESUPUESTO_CONTROL` solo aparece para
        `DIRECCION_GENERAL` y `CONGELAR_LINEA_BASE` solo para
        `DIRECTOR_PROYECTOS`.
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorConflicto'
          examples:
            sin_presupuesto_control:
              summary: HDU-001 esc. 16
              value:
                tipo: CONFLICTO
                codigo: SIN_PRESUPUESTO_CONTROL
                mensaje: Falta capturar el tope de control del tipo de partida MUROS; sin él no se puede evaluar la requisición.
                detalle:
                  obra: AP-058-25 · Union Square F2
                  tipo_partida: MUROS
                  linea_base_id: 8f7e6d5c-4b3a-4291-8f7e-6d5c4b3a2918
                acciones:
                  - clave: CAPTURAR_PRESUPUESTO_CONTROL
                    metodo: PUT
                    ruta: /api/v1/lineas-base/8f7e6d5c-4b3a-4291-8f7e-6d5c4b3a2918/presupuesto-control/0c9d8e7f-6a5b-4c3d-8e2f-1a0b9c8d7e6f
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            sin_linea_base_congelada:
              summary: Obra sin línea base congelada
              value:
                tipo: CONFLICTO
                codigo: SIN_LINEA_BASE_CONGELADA
                mensaje: La obra AP-058-25 no tiene línea base congelada; no hay presupuesto contra el que evaluar.
                detalle:
                  obra: AP-058-25 · Union Square F2
                  linea_base_borrador_id: 8f7e6d5c-4b3a-4291-8f7e-6d5c4b3a2918
                acciones:
                  - clave: CONGELAR_LINEA_BASE
                    metodo: POST
                    ruta: /api/v1/lineas-base/8f7e6d5c-4b3a-4291-8f7e-6d5c4b3a2918/congelacion
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
    ConflictoRN03:
      description: >-
        Requisición bloqueada por `RN-03` —persistida en `BLOQUEADA`, con su
        solicitud ya creada y la acción `VER_SOLICITUD_AUTORIZACION`—, obra sin
        presupuesto contra el que evaluar (`CONFLICTO` `SIN_LINEA_BASE_CONGELADA`
        o `SIN_PRESUPUESTO_CONTROL`, ver `ConflictoSinPresupuesto`), o bloqueo
        vencido.
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorConflicto'
          examples:
            excede_importe:
              summary: HDU-002 esc. 4
              value:
                tipo: REGLA_NEGOCIO
                regla: RN-03
                mensaje: La requisición excede el presupuesto de control disponible del tipo de partida MUROS.
                detalle:
                  obra: AP-058-25 · Union Square F2
                  tipo_partida: MUROS
                  presupuestado: '45000.0000'
                  consumido: '33000.0000'
                  consumido_desglose:
                    requisiciones_vivas: '9000.0000'
                    comprometido: '14000.0000'
                    ejercido: '10000.0000'
                    total: '33000.0000'
                  disponible: '12000.0000'
                  solicitado: '15000.0000'
                  excedente: '3000.0000'
                  requisicion_id: 4d2a9f1c-3b7e-4e5a-8c6d-2f1e0a9b8c7d
                  folio: REQ-AP05825-0042
                  solicitud_autorizacion_id: 9e8d7c6b-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                acciones:
                  - clave: VER_SOLICITUD_AUTORIZACION
                    metodo: GET
                    ruta: /api/v1/solicitudes-autorizacion/9e8d7c6b-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                  - clave: CANCELAR_REQUISICION
                    metodo: POST
                    ruta: /api/v1/requisiciones/4d2a9f1c-3b7e-4e5a-8c6d-2f1e0a9b8c7d/cancelacion
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            excede_volumen:
              summary: HDU-002 esc. 5
              value:
                tipo: REGLA_NEGOCIO
                regla: RN-03
                mensaje: La requisición excede la cantidad presupuestada de Tablero de yeso Ultra Light 1/2" en MUROS, aunque el importe cabe.
                detalle:
                  obra: AP-058-25 · Union Square F2
                  tipo_partida: MUROS
                  presupuestado: '45000.0000'
                  consumido: '33000.0000'
                  disponible: '12000.0000'
                  solicitado: '3600.0000'
                  excedente: '0.0000'
                  insumos:
                    - insumo_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      insumo: Tablero de yeso Ultra Light 1/2"
                      unidad: PZA
                      presupuestado_en_partida: true
                      cantidad_presupuestada: '100.0000'
                      cantidad_consumida: '90.0000'
                      cantidad_disponible: '10.0000'
                      cantidad_solicitada: '25.0000'
                      excedente: '15.0000'
                  requisicion_id: 4d2a9f1c-3b7e-4e5a-8c6d-2f1e0a9b8c7d
                  folio: REQ-AP05825-0043
                  solicitud_autorizacion_id: 9e8d7c6b-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                acciones:
                  - clave: VER_SOLICITUD_AUTORIZACION
                    metodo: GET
                    ruta: /api/v1/solicitudes-autorizacion/9e8d7c6b-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            sin_presupuesto_control:
              summary: HDU-001 esc. 16 · sin tope capturado, visto por Compras
              description: >-
                Quien llama solo tiene el rol `COMPRAS`: la acción
                `CAPTURAR_PRESUPUESTO_CONTROL` exige `DIRECCION_GENERAL`, así que no se
                ofrece.
              value:
                tipo: CONFLICTO
                codigo: SIN_PRESUPUESTO_CONTROL
                mensaje: Falta capturar el tope de control del tipo de partida MUROS; sin él no se puede evaluar la requisición. Pídelo a Dirección General.
                detalle:
                  obra: AP-058-25 · Union Square F2
                  tipo_partida: MUROS
                  linea_base_id: 8f7e6d5c-4b3a-4291-8f7e-6d5c4b3a2918
                acciones: []
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            bloqueo_vencido:
              summary: RNF-16 · vence lock_timeout
              value:
                tipo: CONCURRENCIA
                codigo: BLOQUEO_VENCIDO
                mensaje: Otra operación está usando el presupuesto de MUROS en este momento. Vuelve a intentarlo.
                detalle:
                  espera_maxima_ms: 3000
                acciones:
                  - clave: REINTENTAR
                    metodo: POST
                    ruta: /api/v1/requisiciones
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
    ConflictoRN06:
      description: >-
        La orden tiene material recibido o saldo pendiente: no se cancela ni se
        cierra; el faltante se reprograma (`RN-06`, PA-07).
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorConflicto'
          example:
            tipo: REGLA_NEGOCIO
            regla: RN-06
            mensaje: La orden OC-AP05825-0017 tiene 50 piezas por recibir; una orden solo se cierra al entregarse completa, y el faltante se reprograma.
            detalle:
              orden_compra_id: 5c4b3a29-1807-4f6e-9d5c-4b3a29180716
              folio_orden: OC-AP05825-0017
              estado: PARCIAL
              renglones_con_saldo:
                - orden_compra_renglon_id: 6d5c4b3a-2918-4f07-8e6d-5c4b3a291807
                  insumo: Tablero de yeso Ultra Light 1/2"
                  saldo_pendiente: '50.0000'
                  fecha_compromiso: '2026-10-22'
            acciones:
              - clave: REPROGRAMAR
                metodo: POST
                ruta: /api/v1/ordenes-compra/5c4b3a29-1807-4f6e-9d5c-4b3a29180716/renglones/6d5c4b3a-2918-4f07-8e6d-5c4b3a291807/reprogramacion
            correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
    ConflictoRN07:
      description: >-
        Lo entrante excede el saldo pendiente (`RN-07`). Nada se escribe y el saldo
        no cambia; también cubre orden cerrada o cancelada, folio de remisión
        duplicado, solicitud de excedente que no aplica, corrección sobre orden
        cerrada y bloqueo vencido.
      headers:
        X-Correlacion-Id:
          $ref: '#/components/headers/XCorrelacionId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorConflicto'
          examples:
            excede_ordenado:
              summary: HDU-005 esc. 5
              value:
                tipo: REGLA_NEGOCIO
                regla: RN-07
                mensaje: La entrada excede lo pendiente de recibir de la orden OC-AP05825-0017.
                detalle:
                  orden_compra_id: 5c4b3a29-1807-4f6e-9d5c-4b3a29180716
                  folio_orden: OC-AP05825-0017
                  renglones:
                    - orden_compra_renglon_id: 6d5c4b3a-2918-4f07-8e6d-5c4b3a291807
                      insumo: Tablero de yeso Ultra Light 1/2"
                      unidad: PZA
                      cantidad_ordenada: '100.0000'
                      cantidad_recibida: '50.0000'
                      saldo_pendiente: '50.0000'
                      cantidad_entrante: '70.0000'
                      excedente: '20.0000'
                acciones:
                  - clave: SOLICITAR_AUTORIZACION
                    metodo: POST
                    ruta: /api/v1/solicitudes-autorizacion
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            folio_duplicado:
              summary: HDU-005 esc. 7
              value:
                tipo: CONFLICTO
                codigo: FOLIO_REMISION_DUPLICADO
                mensaje: Ya existe una entrada con la remisión R-4521 de CoPanel. Verifica si es un reingreso por error.
                detalle:
                  entrada_previa_id: b2c3d4e5-f6a7-4890-9bcd-ef0123456789
                  registrada_en: '2026-10-08T09:12:44-06:00'
                acciones:
                  - clave: VER_ENTRADA
                    metodo: GET
                    ruta: /api/v1/entradas-almacen/b2c3d4e5-f6a7-4890-9bcd-ef0123456789
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            solicitud_no_aplicable:
              summary: Solicitud de otro renglón o ya consumida (PA-16)
              value:
                tipo: CONFLICTO
                codigo: SOLICITUD_NO_APLICABLE
                mensaje: La autorización citada ya se usó en otra entrada y no ampara este renglón.
                detalle:
                  solicitud_autorizacion_id: 8e7d6c5b-4a39-4281-9f0e-1d2c3b4a5968
                  orden_compra_renglon_id: 6d5c4b3a-2918-4f07-8e6d-5c4b3a291807
                acciones: []
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
            orden_cerrada_no_se_corrige:
              summary: HDU-005 esc. 23
              value:
                tipo: CONFLICTO
                codigo: ESTADO_NO_PERMITE_OPERACION
                mensaje: La orden OC-AP05825-0017 está cerrada; sus entradas ya no se corrigen.
                detalle:
                  orden_compra_id: 5c4b3a29-1807-4f6e-9d5c-4b3a29180716
                  estado: CERRADA
                acciones: []
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890

  schemas:
    # ------------------------------------------------------------ tipos base
    Uuid:
      type: string
      format: uuid
      examples: [7b1e4c2a-5d3f-4a8b-9c6e-1f2a3b4c5d6e]
    FechaHora:
      type: string
      format: date-time
      description: RFC 3339 **con zona**. El servidor responde con la zona de la obra (asumido, `America/Mexico_City`).
      examples: ['2026-10-15T10:42:00-06:00']
    Fecha:
      type: string
      format: date
      description: Fecha de negocio sin hora (remisión, compromiso de entrega). Es `DATE` en el esquema.
      examples: ['2026-10-22']
    Importe:
      type: string
      format: decimal
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      x-precision: 18
      x-escala: 4
      description: >-
        Importe en pesos, `NUMERIC(18,4)`. Cadena decimal, nunca número JSON. Puede
        ser negativo (ajustes, desviación). El servidor responde siempre con cuatro
        decimales.
      examples: ['45000.0000', '-2000.0000']
    ImporteNoNegativo:
      type: string
      format: decimal
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      x-precision: 18
      x-escala: 4
      description: Importe mayor o igual que cero, `NUMERIC(18,4)`.
      examples: ['500000.0000']
    PrecioUnitario:
      type: string
      format: decimal
      pattern: '^\d{1,10}(\.\d{1,4})?$'
      x-precision: 14
      x-escala: 4
      description: Precio o costo unitario, `NUMERIC(14,4)`, no negativo.
      examples: ['641.3600', '0.2500']
    Cantidad:
      type: string
      format: decimal
      pattern: '^-?\d{1,10}(\.\d{1,4})?$'
      x-precision: 14
      x-escala: 4
      description: Cantidad con signo, `NUMERIC(14,4)`. Solo los movimientos del libro mayor llevan signo.
      examples: ['-20.0000']
    CantidadPositiva:
      type: string
      format: decimal
      pattern: '^\d{1,10}(\.\d{1,4})?$'
      x-precision: 14
      x-escala: 4
      description: >-
        Cantidad de captura, `NUMERIC(14,4)`, **estrictamente mayor que cero**. El
        patrón no excluye el cero; lo rechaza el servidor con `422` señalando el
        renglón.
      examples: ['50.0000']
    CantidadNoNegativa:
      type: string
      format: decimal
      pattern: '^\d{1,10}(\.\d{1,4})?$'
      x-precision: 14
      x-escala: 4
      examples: ['0.0000']
    Rendimiento:
      type: string
      format: decimal
      pattern: '^\d{1,12}(\.\d{1,6})?$'
      x-precision: 18
      x-escala: 6
      description: Insumo por unidad de concepto, `NUMERIC(18,6)`.
      examples: ['0.673400']
    Porcentaje:
      type: string
      format: decimal
      pattern: '^-?\d{1,3}(\.\d{1,6})?$'
      x-precision: 9
      x-escala: 6
      description: 'Fracción, `NUMERIC(9,6)`: `0.050000` es 5 %. Negativa solo en la desviación relativa.'
      examples: ['0.150000']
    ReglaId:
      type: string
      pattern: '^RN-\d{2}$'
      description: Identificador de regla del PRD §8.
      examples: [RN-03]
    Rol:
      type: string
      enum: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS, RESIDENTE, COMPRAS, ALMACEN, ADMINISTRACION]
      description: Los seis roles del PRD §4. Un usuario puede acumular varios.
    Unidad:
      type: string
      enum: [M2, ML, PZA, KG, CAJA, SACO, ROLLO, JORNAL]
    MetaPagina:
      type: object
      required: [pagina, tamano_pagina, total]
      properties:
        pagina:
          type: integer
          minimum: 1
        tamano_pagina:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    Motivo:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 2000
          description: Obligatorio. Vacío o solo espacios responde `422`.
    UsuarioResumen:
      type: object
      required: [id, nombre]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
    ObraResumen:
      type: object
      required: [id, codigo, nombre]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
        nombre:
          type: string
    InsumoResumen:
      type: object
      required: [id, codigo, descripcion, unidad]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
        descripcion:
          type: string
        unidad:
          $ref: '#/components/schemas/Unidad'

    # ---------------------------------------------------- contrato de error
    Accion:
      type: object
      description: >-
        Salida documentada de un rechazo. El cliente la pinta como botón sin
        conocerla de antemano. **Se filtran por los roles de quien llama**: nunca
        se ofrece una acción que le respondería `403`. Por eso `acciones` puede
        llegar vacía aunque el rechazo tenga salida para otro rol. Excepción:
        `REINTENTAR` de una `CONCURRENCIA` no se filtra, porque repite la
        operación que quien llama acaba de invocar y que `api/` ya autorizó por
        su rol (TKT-005).
      required: [clave, metodo, ruta]
      properties:
        clave:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: >-
            `VER_SOLICITUD_AUTORIZACION` (`GET` a la solicitud que nació con el
            bloqueo de `RN-03`) y `SOLICITAR_AUTORIZACION` (`POST
            /solicitudes-autorizacion`, solo tras el rechazo de `RN-07`) son
            claves distintas.
          examples: [VER_SOLICITUD_AUTORIZACION, SOLICITAR_AUTORIZACION, REPROGRAMAR, REINTENTAR]
        metodo:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        ruta:
          type: string
          pattern: '^/'
          description: Ruta absoluta del API, con el prefijo `/api/v1`.
    ErrorReglaNegocio:
      type: object
      description: >-
        Violación de una regla del PRD. Código `409`. Es exactamente el contrato de
        arquitectura §7.3 más `correlacion_id` (`RNF-13`).
      required: [tipo, regla, mensaje, detalle, acciones, correlacion_id]
      properties:
        tipo:
          type: string
          const: REGLA_NEGOCIO
        regla:
          $ref: '#/components/schemas/ReglaId'
        mensaje:
          type: string
        detalle:
          description: Las cifras del rechazo. Todo importe y cantidad como cadena.
          anyOf:
            - $ref: '#/components/schemas/DetalleExcedePresupuesto'
            - $ref: '#/components/schemas/DetalleExcedeOrdenado'
            - $ref: '#/components/schemas/DetalleOrdenConSaldo'
            - $ref: '#/components/schemas/DetalleGenerico'
        acciones:
          type: array
          items:
            $ref: '#/components/schemas/Accion'
        correlacion_id:
          $ref: '#/components/schemas/Uuid'
    ErrorConflictoEstado:
      type: object
      description: >-
        Conflicto de estado o de unicidad que no es violación de una regla `RN-xx`:
        código duplicado, transición inválida, solicitud ya resuelta, archivo que no
        coincide. Código `409`. Misma forma que `REGLA_NEGOCIO` con `codigo` en
        lugar de `regla`.
      required: [tipo, codigo, mensaje, detalle, acciones, correlacion_id]
      properties:
        tipo:
          type: string
          const: CONFLICTO
        codigo:
          $ref: '#/components/schemas/CodigoConflicto'
        mensaje:
          type: string
        detalle:
          $ref: '#/components/schemas/DetalleGenerico'
        acciones:
          type: array
          items:
            $ref: '#/components/schemas/Accion'
        correlacion_id:
          $ref: '#/components/schemas/Uuid'
    CodigoConflicto:
      type: string
      description: >-
        **Catálogo cerrado** (TKT-005). Un `409` que no viola una `RN-xx` lleva uno
        de estos códigos, nunca una regla inventada. Ampliarlo exige cambiar este
        borrador en el mismo PR que añade el caso que lo produce.
      enum:
        - CODIGO_OBRA_DUPLICADO
        - RFC_DUPLICADO
        - FOLIO_REMISION_DUPLICADO
        - OBRA_CON_HISTORIAL
        - ESTADO_NO_PERMITE_OPERACION
        - IMPORTACION_EN_CURSO
        - IMPORTACION_CON_ERRORES
        - REEMPLAZO_NO_CONFIRMADO
        - SIN_LINEA_BASE_CONGELADA
        - SIN_PRESUPUESTO_CONTROL
        - TOPE_SUPERIOR_A_VENTA_SIN_CONFIRMAR
        - YA_RESUELTA
        - SOLICITUD_SIN_EFECTO
        - SOLICITUD_NO_APLICABLE
        - ORDEN_YA_EMITIDA
        - ORDEN_YA_CERRADA
        - ORDEN_NO_ADMITE_ENTRADAS
        - SIN_SALDO_PENDIENTE
        - PROVEEDOR_INACTIVO
        - PROVEEDOR_CON_ORDENES_ABIERTAS
        - ARCHIVO_NO_SUBIDO
        - ARCHIVO_NO_DISPONIBLE
        - ARCHIVO_TAMANO_DISTINTO
        - ARCHIVO_HASH_DISTINTO
        - ARCHIVO_TIPO_NO_PERMITIDO
        - ARCHIVO_CADUCADO
    ErrorConcurrencia:
      type: object
      description: >-
        Venció `lock_timeout` o `statement_timeout` (`RNF-16`). Código `409`, con
        cabecera `Retry-After` y la acción `REINTENTAR`, que no se filtra por los
        roles de quien llama: repite la operación ya autorizada. Nada se persistió. No lleva
        `regla`: no se violó ninguna, y asentarlo como `RN-03` contaminaría la
        consulta de excepciones.
      required: [tipo, codigo, mensaje, detalle, acciones, correlacion_id]
      properties:
        tipo:
          type: string
          const: CONCURRENCIA
        codigo:
          type: string
          enum: [BLOQUEO_VENCIDO, TIEMPO_EJECUCION_VENCIDO]
        mensaje:
          type: string
        detalle:
          type: object
          properties:
            espera_maxima_ms:
              type: integer
              minimum: 0
        acciones:
          type: array
          items:
            $ref: '#/components/schemas/Accion'
        correlacion_id:
          $ref: '#/components/schemas/Uuid'
    ErrorConflicto:
      description: Cualquier `409`. El cliente lo distingue por `tipo`.
      oneOf:
        - $ref: '#/components/schemas/ErrorReglaNegocio'
        - $ref: '#/components/schemas/ErrorConflictoEstado'
        - $ref: '#/components/schemas/ErrorConcurrencia'
      discriminator:
        propertyName: tipo
        mapping:
          REGLA_NEGOCIO: '#/components/schemas/ErrorReglaNegocio'
          CONFLICTO: '#/components/schemas/ErrorConflictoEstado'
          CONCURRENCIA: '#/components/schemas/ErrorConcurrencia'
    ErrorValidacion:
      type: object
      description: >-
        Error de forma. Código `422`. Sustituye al cuerpo por omisión de FastAPI
        (`detail` con `loc`), que no cumple el contrato (TKT-005).
      required: [tipo, mensaje, errores, correlacion_id]
      properties:
        tipo:
          type: string
          const: VALIDACION
        mensaje:
          type: string
        errores:
          type: array
          minItems: 1
          items:
            type: object
            required: [campo, codigo, mensaje]
            properties:
              campo:
                type: string
                description: Ruta del campo en el cuerpo o en la consulta, p. ej. `renglones[1].cantidad`.
              codigo:
                type: string
                enum: [OBLIGATORIO, FORMATO, NO_POSITIVO, FUERA_DE_RANGO, FECHA_ANTERIOR_A_VIGENTE, VALOR_NO_PERMITIDO, DEMASIADO_LARGO]
              mensaje:
                type: string
              regla:
                $ref: '#/components/schemas/ReglaId'
        correlacion_id:
          $ref: '#/components/schemas/Uuid'
    ErrorPermiso:
      type: object
      description: >-
        Falta de permiso. Código `403`. **Nunca incluye cifras del recurso**
        (HDU-006 esc. 12). Con usuario autenticado se asienta en la bitácora como
        `DENEGAR`, en una transacción propia porque no hay cambio que acompañar.
        Las denegaciones anónimas —CSRF o credenciales en el inicio de sesión— van
        a `intento_acceso` y al registro técnico, no a la bitácora.
      required: [tipo, motivo, mensaje, roles_requeridos, correlacion_id]
      properties:
        tipo:
          type: string
          const: PERMISO
        motivo:
          type: string
          enum: [ROL_INSUFICIENTE, AUTO_RESOLUCION, NO_ES_SOLICITANTE, ORIGEN_NO_VERIFICADO]
          description: >-
            `ROL_INSUFICIENTE` lo decide `api/`; `AUTO_RESOLUCION` —nadie resuelve
            lo suyo— y `NO_ES_SOLICITANTE` los decide `dominio/`; `ORIGEN_NO_VERIFICADO` es el token CSRF
            ausente o distinto.
        mensaje:
          type: string
        roles_requeridos:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
        correlacion_id:
          $ref: '#/components/schemas/Uuid'
    ErrorSesion:
      type: object
      description: Código `401`.
      required: [tipo, motivo, mensaje, correlacion_id]
      properties:
        tipo:
          type: string
          const: SESION
        motivo:
          type: string
          enum: [SIN_SESION, SESION_CADUCADA, SESION_REVOCADA, CREDENCIALES_INVALIDAS]
          description: '`CREDENCIALES_INVALIDAS` no distingue correo inexistente de contraseña errónea.'
        mensaje:
          type: string
        correlacion_id:
          $ref: '#/components/schemas/Uuid'
    ErrorLimiteIntentos:
      type: object
      description: Código `429`. Misma respuesta por cuenta que por origen, para no revelar qué cuentas existen.
      required: [tipo, mensaje, reintentar_en_s, correlacion_id]
      properties:
        tipo:
          type: string
          const: LIMITE_INTENTOS
        mensaje:
          type: string
        reintentar_en_s:
          type: integer
          minimum: 0
        correlacion_id:
          $ref: '#/components/schemas/Uuid'
    ErrorNoEncontrado:
      type: object
      description: Código `404`.
      required: [tipo, recurso, mensaje, correlacion_id]
      properties:
        tipo:
          type: string
          const: NO_ENCONTRADO
        recurso:
          type: string
          examples: [requisicion]
        mensaje:
          type: string
        correlacion_id:
          $ref: '#/components/schemas/Uuid'
    DetalleGenerico:
      type: object
      description: Cifras y referencias del rechazo. Importes y cantidades siempre como cadena.
      additionalProperties: true
    ConsumidoDesglose:
      type: object
      description: '`consumido = requisiciones_vivas + comprometido + ejercido` (modelo de datos §15). Solo fuentes `REAL`.'
      required: [requisiciones_vivas, comprometido, ejercido, total]
      properties:
        requisiciones_vivas:
          $ref: '#/components/schemas/Importe'
        comprometido:
          $ref: '#/components/schemas/Importe'
        ejercido:
          $ref: '#/components/schemas/Importe'
        total:
          $ref: '#/components/schemas/Importe'
    DetalleExcedePresupuesto:
      type: object
      description: Detalle de `RN-03`, por importe y, si aplica, por insumo.
      required: [obra, tipo_partida, disponible, solicitado, excedente]
      properties:
        obra:
          type: string
          description: Código y nombre para mostrar.
          examples: [AP-058-25 · Union Square F2]
        tipo_partida:
          type: string
          examples: [MUROS]
        presupuestado:
          $ref: '#/components/schemas/Importe'
        consumido:
          $ref: '#/components/schemas/Importe'
        consumido_desglose:
          $ref: '#/components/schemas/ConsumidoDesglose'
        disponible:
          $ref: '#/components/schemas/Importe'
        solicitado:
          $ref: '#/components/schemas/Importe'
        excedente:
          $ref: '#/components/schemas/Importe'
        causa:
          type: string
          enum: [EXCEDE_IMPORTE, EXCEDE_VOLUMEN, INSUMO_NO_PRESUPUESTADO]
          description: >-
            Solo excesos reales. La falta de línea base o de tope no es `RN-03`:
            es `CONFLICTO` `SIN_LINEA_BASE_CONGELADA` o `SIN_PRESUPUESTO_CONTROL`.
        insumos:
          type: array
          items:
            type: object
            required: [insumo_id, insumo, unidad, presupuestado_en_partida, cantidad_presupuestada, cantidad_consumida, cantidad_disponible, cantidad_solicitada, excedente]
            properties:
              insumo_id:
                $ref: '#/components/schemas/Uuid'
              insumo:
                type: string
              unidad:
                $ref: '#/components/schemas/Unidad'
              presupuestado_en_partida:
                type: boolean
                description: '`false` si el insumo no está en la explosión de la partida: disponible cero, no ilimitado (HDU-002 esc. 8).'
              cantidad_presupuestada:
                $ref: '#/components/schemas/CantidadNoNegativa'
              cantidad_consumida:
                $ref: '#/components/schemas/CantidadNoNegativa'
              cantidad_disponible:
                $ref: '#/components/schemas/Cantidad'
              cantidad_solicitada:
                $ref: '#/components/schemas/CantidadNoNegativa'
              excedente:
                $ref: '#/components/schemas/CantidadNoNegativa'
        requisicion_id:
          $ref: '#/components/schemas/Uuid'
        folio:
          type: string
        solicitud_autorizacion_id:
          $ref: '#/components/schemas/Uuid'
    DetalleExcedeOrdenado:
      type: object
      description: Detalle de `RN-07`.
      required: [orden_compra_id, folio_orden, renglones]
      properties:
        orden_compra_id:
          $ref: '#/components/schemas/Uuid'
        folio_orden:
          type: string
        renglones:
          type: array
          items:
            type: object
            required: [orden_compra_renglon_id, insumo, cantidad_ordenada, cantidad_recibida, saldo_pendiente, cantidad_entrante, excedente]
            properties:
              orden_compra_renglon_id:
                $ref: '#/components/schemas/Uuid'
              insumo:
                type: string
              unidad:
                $ref: '#/components/schemas/Unidad'
              cantidad_ordenada:
                $ref: '#/components/schemas/CantidadNoNegativa'
              cantidad_recibida:
                $ref: '#/components/schemas/CantidadNoNegativa'
              saldo_pendiente:
                $ref: '#/components/schemas/CantidadNoNegativa'
              cantidad_entrante:
                $ref: '#/components/schemas/CantidadNoNegativa'
              excedente:
                $ref: '#/components/schemas/CantidadNoNegativa'
    DetalleOrdenConSaldo:
      type: object
      description: Detalle de `RN-06`.
      required: [orden_compra_id, folio_orden, estado, renglones_con_saldo]
      properties:
        orden_compra_id:
          $ref: '#/components/schemas/Uuid'
        folio_orden:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoOrdenCompra'
        renglones_con_saldo:
          type: array
          items:
            type: object
            required: [orden_compra_renglon_id, insumo, saldo_pendiente, fecha_compromiso]
            properties:
              orden_compra_renglon_id:
                $ref: '#/components/schemas/Uuid'
              insumo:
                type: string
              saldo_pendiente:
                $ref: '#/components/schemas/CantidadNoNegativa'
              fecha_compromiso:
                $ref: '#/components/schemas/Fecha'

    # ------------------------------------------------------------- identidad
    TokenCsrf:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
    CredencialesInicio:
      type: object
      required: [email, contrasena]
      properties:
        email:
          type: string
          format: email
        contrasena:
          type: string
          minLength: 1
          writeOnly: true
    UsuarioActual:
      type: object
      required: [id, nombre, email, roles, sesion]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
        sesion:
          type: object
          required: [expira_en, expira_por_inactividad_en]
          properties:
            expira_en:
              $ref: '#/components/schemas/FechaHora'
            expira_por_inactividad_en:
              $ref: '#/components/schemas/FechaHora'

    # ------------------------------------------------- presupuesto · catálogos
    TipoPartida:
      type: object
      required: [id, clave, nombre]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clave:
          type: string
          enum: [MUROS, PLAFONES_Y_CAJILLOS, ENCHAPES, GENERALES]
        nombre:
          type: string
    TipoInsumo:
      type: string
      enum: [MATERIAL, MANO_OBRA, HERRAMIENTA, CONSUMIBLE]
    Insumo:
      type: object
      required: [id, codigo, descripcion, tipo, unidad, activo, creado_en_importacion]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          examples: [ULTRALIGHT-1/2]
        descripcion:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoInsumo'
        unidad:
          $ref: '#/components/schemas/Unidad'
        activo:
          type: boolean
        creado_en_importacion:
          type: boolean
          description: Dado de alta por un importador; se revisa en la previsualización (HDU-001 esc. 10).
    ListaInsumos:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Insumo'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'

    # ----------------------------------------------------- presupuesto · obra
    EstadoObra:
      type: string
      enum: [PLANEACION, ACTIVA, SUSPENDIDA, CERRADA]
    ObraNueva:
      type: object
      required: [codigo, nombre, domicilio, tipo_contrato, retencion_destajo_pct, fondo_garantia_pct, iva_acreditable]
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 40
          examples: [AP-058-25]
        nombre:
          type: string
          minLength: 1
        domicilio:
          type: string
          minLength: 1
        tipo_contrato:
          type: string
          enum: [PRECIO_ALZADO_MAXIMO_GARANTIZADO]
        retencion_destajo_pct:
          $ref: '#/components/schemas/Porcentaje'
        fondo_garantia_pct:
          $ref: '#/components/schemas/Porcentaje'
        iva_acreditable:
          type: boolean
          description: '`false`: el IVA es costo y permanece en el precio unitario (`RN-25`).'
        umbral_alerta_pct:
          description: >-
            Umbral de desviación relativa que separa `AMARILLO` de `ROJO` en el
            semáforo; la alerta (F7.3) sale con `ROJO` (`PA-18`). `null`: toda
            desviación positiva es `ROJO`.
          oneOf:
            - $ref: '#/components/schemas/Porcentaje'
            - type: 'null'
    ObraCambios:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
        domicilio:
          type: string
          minLength: 1
        retencion_destajo_pct:
          $ref: '#/components/schemas/Porcentaje'
        fondo_garantia_pct:
          $ref: '#/components/schemas/Porcentaje'
        iva_acreditable:
          type: boolean
        umbral_alerta_pct:
          description: >-
            Umbral de desviación relativa que separa `AMARILLO` de `ROJO` en el
            semáforo; la alerta (F7.3) sale con `ROJO` (`PA-18`). `null`: toda
            desviación positiva es `ROJO`.
          oneOf:
            - $ref: '#/components/schemas/Porcentaje'
            - type: 'null'
    Obra:
      type: object
      required: [id, codigo, nombre, domicilio, tipo_contrato, retencion_destajo_pct, fondo_garantia_pct, iva_acreditable, umbral_alerta_pct, estado, linea_base_vigente_id, creado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
        nombre:
          type: string
        domicilio:
          type: string
        tipo_contrato:
          type: string
          enum: [PRECIO_ALZADO_MAXIMO_GARANTIZADO]
        retencion_destajo_pct:
          $ref: '#/components/schemas/Porcentaje'
        fondo_garantia_pct:
          $ref: '#/components/schemas/Porcentaje'
        iva_acreditable:
          type: boolean
        umbral_alerta_pct:
          description: >-
            Umbral de desviación relativa que separa `AMARILLO` de `ROJO` en el
            semáforo; la alerta (F7.3) sale con `ROJO` (`PA-18`). `null`: toda
            desviación positiva es `ROJO`.
          oneOf:
            - $ref: '#/components/schemas/Porcentaje'
            - type: 'null'
        estado:
          $ref: '#/components/schemas/EstadoObra'
        linea_base_vigente_id:
          description: La línea base `CONGELADA`, o `null` si todavía no hay.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        creado_en:
          $ref: '#/components/schemas/FechaHora'
        actualizado_en:
          $ref: '#/components/schemas/FechaHora'
    ListaObras:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Obra'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'

    # ---------------------------------------------------------------- archivos
    DeclaracionArchivo:
      type: object
      description: Lo que el cliente declara antes de subir. La confirmación lo comprueba contra el objeto almacenado.
      required: [nombre_original, tamano_bytes, hash_sha256, tipo_declarado]
      properties:
        nombre_original:
          type: string
          minLength: 1
          maxLength: 255
          description: Se guarda como dato y se muestra; nunca se usa como ruta.
        tamano_bytes:
          type: integer
          minimum: 1
          description: Límite por tipo en configuración (`RNF-06`; límites asumidos, `PA-15`).
        hash_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        tipo_declarado:
          type: string
          description: >-
            Tipo MIME que declara el cliente. Orienta el prerrechazo —en la
            importación solo se admite `.xlsx`, nunca `.xls`—; **no decide nada**:
            el tipo real se lee de los bytes al confirmar.
    EstadoArchivo:
      type: string
      enum: [PENDIENTE, DISPONIBLE, ANULADO]
    Archivo:
      type: object
      required: [id, obra_id, referencia_tipo, referencia_id, estado, nombre_original, tamano_bytes, hash_sha256, subido_por, creado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        obra_id:
          $ref: '#/components/schemas/Uuid'
        referencia_tipo:
          type: string
          enum: [AVANCE, ENTRADA_ALMACEN, MERMA, FACTURA_PROVEEDOR, IMPORTACION, OBRA]
          description: En la fase 1 solo se emite `IMPORTACION`; el resto llega con TKT-066.
        referencia_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        estado:
          $ref: '#/components/schemas/EstadoArchivo'
        nombre_original:
          type: string
        tipo_mime:
          description: Determinado leyendo los bytes al confirmar; `null` mientras está `PENDIENTE`.
          type: [string, 'null']
        tamano_bytes:
          type: integer
        hash_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        subido_por:
          $ref: '#/components/schemas/UsuarioResumen'
        creado_en:
          $ref: '#/components/schemas/FechaHora'
        confirmado_en:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
    UrlSubida:
      type: object
      description: >-
        URL prefirmada de escritura. Durante su vida es la credencial: vida corta,
        un solo objeto, clave generada por el sistema.
      required: [url, metodo, cabeceras, expira_en]
      properties:
        url:
          type: string
          format: uri
        metodo:
          type: string
          const: PUT
        cabeceras:
          type: object
          description: Cabeceras que el cliente debe enviar tal cual, incluidas las firmadas.
          additionalProperties:
            type: string
        expira_en:
          $ref: '#/components/schemas/FechaHora'
    UrlDescarga:
      type: object
      required: [url, expira_en, tipo_mime, nombre_original, disposicion]
      properties:
        url:
          type: string
          format: uri
          description: En un origen distinto al de la aplicación (`RNF-06`).
        expira_en:
          $ref: '#/components/schemas/FechaHora'
        tipo_mime:
          type: string
        nombre_original:
          type: string
        disposicion:
          type: string
          enum: [inline, attachment]

    # ---------------------------------------------- presupuesto · importación
    EstadoImportacion:
      type: string
      enum: [RECIBIDO, ANALIZANDO, VALIDADO, CON_ERRORES, CONFIRMADO, DESCARTADO]
    ImportacionNueva:
      type: object
      required: [archivo]
      properties:
        archivo:
          $ref: '#/components/schemas/DeclaracionArchivo'
    ImportacionCreada:
      type: object
      required: [importacion, subida]
      properties:
        importacion:
          $ref: '#/components/schemas/Importacion'
        subida:
          $ref: '#/components/schemas/UrlSubida'
    Importacion:
      type: object
      required: [id, obra_id, archivo_id, estado, importado_por, creado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        obra_id:
          $ref: '#/components/schemas/Uuid'
        archivo_id:
          description: Identificador lógico del Excel en `archivos`, sin clave foránea entre módulos.
          allOf:
            - $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/EstadoImportacion'
        progreso:
          description: Fracción leída mientras está `ANALIZANDO`.
          oneOf:
            - $ref: '#/components/schemas/Porcentaje'
            - type: 'null'
        filas_leidas:
          type: [integer, 'null']
        filas_validas:
          type: [integer, 'null']
        filas_rechazadas:
          type: [integer, 'null']
        resumen:
          description: Previsualización, presente desde `VALIDADO` o `CON_ERRORES`.
          oneOf:
            - $ref: '#/components/schemas/ResumenImportacion'
            - type: 'null'
        importado_por:
          $ref: '#/components/schemas/UsuarioResumen'
        creado_en:
          $ref: '#/components/schemas/FechaHora'
        latido:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
    ResumenImportacion:
      type: object
      required: [niveles, areas, partidas, conceptos, importe_total, por_tipo_partida, insumos_creados]
      properties:
        niveles:
          type: integer
        areas:
          type: integer
        partidas:
          type: integer
        conceptos:
          type: integer
        importe_total:
          $ref: '#/components/schemas/Importe'
        por_tipo_partida:
          type: array
          items:
            type: object
            required: [tipo_partida, conceptos, importe_venta]
            properties:
              tipo_partida:
                $ref: '#/components/schemas/TipoPartida'
              conceptos:
                type: integer
              importe_venta:
                $ref: '#/components/schemas/Importe'
        insumos_creados:
          type: array
          items:
            $ref: '#/components/schemas/InsumoResumen'
    TipoErrorImportacion:
      type: string
      enum: [REF_ROTA, UNIDAD_DESCONOCIDA, SIN_APU, RENDIMIENTO_AUSENTE, DUPLICADO, SIN_CONCEPTOS, PROCESO_INTERRUMPIDO]
      description: >-
        `SIN_CONCEPTOS`: la hoja no tiene ninguna fila de concepto; la importación
        queda `CON_ERRORES` (HDU-001 esc. 27). Lleva `fila` y `columna` nulas.
    ErrorImportacion:
      type: object
      required: [id, hoja, fila, columna, tipo, mensaje]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hoja:
          type: [string, 'null']
        fila:
          type: [integer, 'null']
        columna:
          type: [string, 'null']
        tipo:
          $ref: '#/components/schemas/TipoErrorImportacion'
        mensaje:
          type: string
        valor_original:
          type: [string, 'null']
    ListaErroresImportacion:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/ErrorImportacion'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'
      examples:
        - elementos:
            - id: 0f1e2d3c-4b5a-4968-8776-655443322110
              hoja: CATALOGO
              fila: 214
              columna: P.U.
              tipo: REF_ROTA
              mensaje: La celda de precio unitario contiene una referencia rota.
              valor_original: '#REF!'
          paginacion:
            pagina: 1
            tamano_pagina: 50
            total: 1
    ListaImportaciones:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Importacion'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'
    ConfirmacionImportacion:
      type: object
      properties:
        reemplazar_borrador:
          type: boolean
          default: false
          description: Confirmación explícita de reemplazar la línea base en borrador (HDU-001 esc. 13).
        motivo_reemplazo:
          type: [string, 'null']
          description: Obligatorio si `reemplazar_borrador` es `true`.
    ImportacionConfirmada:
      type: object
      required: [importacion, linea_base]
      properties:
        importacion:
          $ref: '#/components/schemas/Importacion'
        linea_base:
          $ref: '#/components/schemas/LineaBase'

    # ----------------------------------------------- presupuesto · línea base
    EstadoLineaBase:
      type: string
      enum: [BORRADOR, CONGELADA, SUPERSEDIDA]
    LineaBase:
      type: object
      required: [id, obra_id, version, estado, importe_venta, por_tipo_partida]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        obra_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        estado:
          $ref: '#/components/schemas/EstadoLineaBase'
        importe_venta:
          $ref: '#/components/schemas/Importe'
        congelada_en:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        congelada_por:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        motivo:
          type: [string, 'null']
        por_tipo_partida:
          type: array
          items:
            type: object
            required: [tipo_partida, importe_venta]
            properties:
              tipo_partida:
                $ref: '#/components/schemas/TipoPartida'
              importe_venta:
                $ref: '#/components/schemas/Importe'
    ConceptoLineaBase:
      type: object
      required: [id, codigo, descripcion, unidad, cantidad, precio_unitario, importe, nivel, area, tipo_partida]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        codigo:
          type: string
          examples: ['620001']
        descripcion:
          type: string
        unidad:
          $ref: '#/components/schemas/Unidad'
        cantidad:
          $ref: '#/components/schemas/CantidadNoNegativa'
        precio_unitario:
          $ref: '#/components/schemas/PrecioUnitario'
        importe:
          $ref: '#/components/schemas/Importe'
        nivel:
          type: string
        area:
          type: string
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
      examples:
        - id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
          codigo: '620001'
          descripcion: Suministro y fabricación de Muro falso 10 cm
          unidad: M2
          cantidad: '77.3900'
          precio_unitario: '668.6900'
          importe: '51749.9191'
          nivel: NIVEL 3
          area: DEPARTAMENTO 312 TIPO 2R+
          tipo_partida:
            id: 0c9d8e7f-6a5b-4c3d-8e2f-1a0b9c8d7e6f
            clave: MUROS
            nombre: MUROS
    ListaConceptosLineaBase:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/ConceptoLineaBase'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'
    RenglonExplosion:
      type: object
      required: [tipo_partida, insumo, cantidad_presupuestada, rendimiento_congelado, costo_unitario, importe_venta]
      properties:
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
        insumo:
          $ref: '#/components/schemas/InsumoResumen'
        cantidad_presupuestada:
          $ref: '#/components/schemas/CantidadNoNegativa'
        rendimiento_congelado:
          $ref: '#/components/schemas/Rendimiento'
        costo_unitario:
          $ref: '#/components/schemas/PrecioUnitario'
        importe_venta:
          $ref: '#/components/schemas/Importe'
    ExplosionInsumos:
      type: object
      required: [linea_base_id, renglones, importe_total]
      properties:
        linea_base_id:
          $ref: '#/components/schemas/Uuid'
        renglones:
          type: array
          items:
            $ref: '#/components/schemas/RenglonExplosion'
        importe_total:
          $ref: '#/components/schemas/Importe'
      examples:
        - linea_base_id: 8f7e6d5c-4b3a-4291-8f7e-6d5c4b3a2918
          importe_total: '2755187.2112'
          renglones:
            - tipo_partida:
                id: 0c9d8e7f-6a5b-4c3d-8e2f-1a0b9c8d7e6f
                clave: MUROS
                nombre: MUROS
              insumo:
                id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                codigo: ULTRALIGHT-1/2
                descripcion: Tablero de yeso Ultra Light 1/2"
                unidad: PZA
              cantidad_presupuestada: '1459.5600'
              rendimiento_congelado: '0.673400'
              costo_unitario: '250.0000'
              importe_venta: '364890.0000'

    # ------------------------------------- presupuesto · presupuesto de control
    PresupuestoControl:
      type: object
      required: [tipo_partida, importe_venta, importe_sugerido, importe_tope]
      properties:
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
        importe_venta:
          $ref: '#/components/schemas/Importe'
        importe_sugerido:
          description: Informativo, quitando utilidad e indirectos. **No** lo usa `RN-03`.
          allOf:
            - $ref: '#/components/schemas/Importe'
        importe_tope:
          description: El capturado por Dirección (PA-03). `null` mientras no se capture.
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        capturado_por:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        capturado_en:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        actualizado_por:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        actualizado_en:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        motivo_ultimo_cambio:
          type: [string, 'null']
    CapturaPresupuestoControl:
      type: object
      required: [importe_tope]
      properties:
        importe_tope:
          $ref: '#/components/schemas/ImporteNoNegativo'
        motivo:
          type: [string, 'null']
          description: Obligatorio al recapturar y al confirmar un tope superior a la venta.
        confirmar_superior_a_venta:
          type: boolean
          default: false

    # ------------------------------------------------------ compras · disponible
    DisponibleInsumo:
      type: object
      required: [insumo, cantidad_presupuestada, cantidad_consumida, cantidad_disponible]
      properties:
        insumo:
          $ref: '#/components/schemas/InsumoResumen'
        cantidad_presupuestada:
          $ref: '#/components/schemas/CantidadNoNegativa'
        cantidad_consumida:
          $ref: '#/components/schemas/CantidadNoNegativa'
        cantidad_disponible:
          $ref: '#/components/schemas/Cantidad'
    Disponible:
      type: object
      required: [obra_id, tipo_partida, presupuestado, consumido, disponible, insumos, calculado_en]
      properties:
        obra_id:
          $ref: '#/components/schemas/Uuid'
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
        presupuestado:
          $ref: '#/components/schemas/Importe'
        consumido:
          $ref: '#/components/schemas/ConsumidoDesglose'
        disponible:
          $ref: '#/components/schemas/Importe'
        insumos:
          type: array
          items:
            $ref: '#/components/schemas/DisponibleInsumo'
        calculado_en:
          $ref: '#/components/schemas/FechaHora'

    # --------------------------------------------------- compras · requisiciones
    EstadoRequisicion:
      type: string
      enum: [BORRADOR, EVALUADA, BLOQUEADA, AUTORIZADA, RECHAZADA, CANCELADA, CONVERTIDA]
    RenglonRequisicionNuevo:
      type: object
      required: [insumo_id, cantidad, costo_unitario_estimado]
      properties:
        insumo_id:
          $ref: '#/components/schemas/Uuid'
        cantidad:
          $ref: '#/components/schemas/CantidadPositiva'
        costo_unitario_estimado:
          $ref: '#/components/schemas/PrecioUnitario'
    RequisicionContenido:
      type: object
      required: [obra_id, tipo_partida_id, renglones]
      properties:
        obra_id:
          description: Obligatorio (`RN-02`).
          allOf:
            - $ref: '#/components/schemas/Uuid'
        tipo_partida_id:
          description: Obligatorio (`RN-02`, PA-01). Su ausencia es `422` con la regla citada.
          allOf:
            - $ref: '#/components/schemas/Uuid'
        renglones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RenglonRequisicionNuevo'
        observaciones:
          type: [string, 'null']
    RequisicionNueva:
      allOf:
        - $ref: '#/components/schemas/RequisicionContenido'
        - type: object
          properties:
            enviar:
              type: boolean
              default: false
              description: '`true` evalúa `RN-03` en la misma transacción; `false` guarda en `BORRADOR`.'
    RenglonRequisicion:
      type: object
      required: [id, insumo, cantidad, costo_unitario_estimado, importe]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        insumo:
          $ref: '#/components/schemas/InsumoResumen'
        cantidad:
          $ref: '#/components/schemas/CantidadNoNegativa'
        costo_unitario_estimado:
          $ref: '#/components/schemas/PrecioUnitario'
        importe:
          $ref: '#/components/schemas/Importe'
        cantidad_disponible:
          description: Volumen disponible del insumo al evaluar; `null` en `BORRADOR`.
          oneOf:
            - $ref: '#/components/schemas/Cantidad'
            - type: 'null'
    Requisicion:
      type: object
      required: [id, folio, obra_id, tipo_partida, estado, solicitante, renglones, importe_solicitado, creado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        folio:
          type: string
          examples: [REQ-AP05825-0042]
        obra_id:
          $ref: '#/components/schemas/Uuid'
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
        estado:
          $ref: '#/components/schemas/EstadoRequisicion'
        solicitante:
          $ref: '#/components/schemas/UsuarioResumen'
        renglones:
          type: array
          items:
            $ref: '#/components/schemas/RenglonRequisicion'
        importe_solicitado:
          $ref: '#/components/schemas/Importe'
        importe_disponible:
          description: Disponible en el momento de evaluar, persistido; no se recalcula.
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        importe_excedente:
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        regla_bloqueo:
          oneOf:
            - $ref: '#/components/schemas/ReglaId'
            - type: 'null'
        evaluada_en:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        solicitud_autorizacion_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        orden_compra_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        motivo_cancelacion:
          type: [string, 'null']
        observaciones:
          type: [string, 'null']
        creado_en:
          $ref: '#/components/schemas/FechaHora'
        actualizado_en:
          $ref: '#/components/schemas/FechaHora'
    RequisicionResumen:
      type: object
      required: [id, folio, obra_id, tipo_partida, estado, solicitante, importe_solicitado, creado_en, antiguedad_dias]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        folio:
          type: string
        obra_id:
          $ref: '#/components/schemas/Uuid'
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
        estado:
          $ref: '#/components/schemas/EstadoRequisicion'
        solicitante:
          $ref: '#/components/schemas/UsuarioResumen'
        importe_solicitado:
          $ref: '#/components/schemas/Importe'
        evaluada_en:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        creado_en:
          $ref: '#/components/schemas/FechaHora'
        antiguedad_dias:
          type: integer
          minimum: 0
          description: Días desde la evaluación (o la creación, si es borrador).
    ListaRequisiciones:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/RequisicionResumen'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'

    # ------------------------------------- compras · solicitudes de autorización
    MotivoSolicitud:
      type: string
      enum: [EXCEDE_PRESUPUESTO, EXCEDE_ORDENADO, EXCEDE_CONSIGNACION, TRABAJO_EXTRA]
      description: En la fase 1 solo nacen `EXCEDE_PRESUPUESTO` (`RN-03`) y `EXCEDE_ORDENADO` (`RN-07`).
    EstadoSolicitud:
      type: string
      enum: [PENDIENTE, AUTORIZADA, RECHAZADA]
    SolicitudAutorizacion:
      type: object
      required: [id, motivo, entidad_tipo, entidad_id, regla, solicitante, rol_autorizador, estado, sin_efecto, obra, contexto, creado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        motivo:
          $ref: '#/components/schemas/MotivoSolicitud'
        entidad_tipo:
          type: string
          enum: [REQUISICION, ORDEN_COMPRA]
        entidad_id:
          $ref: '#/components/schemas/Uuid'
        regla:
          $ref: '#/components/schemas/ReglaId'
        solicitante:
          $ref: '#/components/schemas/UsuarioResumen'
        rol_autorizador:
          $ref: '#/components/schemas/Rol'
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        sin_efecto:
          type: boolean
          description: '`true` si su requisición se canceló estando pendiente: se muestra y no admite resolución.'
        motivo_sin_efecto:
          type: [string, 'null']
        obra:
          $ref: '#/components/schemas/ObraResumen'
        tipo_partida:
          oneOf:
            - $ref: '#/components/schemas/TipoPartida'
            - type: 'null'
        importe_solicitado:
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        excedente:
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        orden_compra_renglon_id:
          description: Solo `EXCEDE_ORDENADO`; el renglón cuyo excedente se pide (`PA-16`). `null` en los demás motivos.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        cantidad_excedente:
          description: >-
            Solo `EXCEDE_ORDENADO`: la cantidad que excede el saldo, recalculada
            por el servidor al crear la solicitud. Es el máximo que la entrada que
            la consuma puede pasar del saldo (`RN-07`). `null` en los demás motivos.
          oneOf:
            - $ref: '#/components/schemas/CantidadPositiva'
            - type: 'null'
        consumida_por_entrada_id:
          description: >-
            Solo `EXCEDE_ORDENADO`: la entrada que usó la autorización, derivada
            del `entrada_renglon` que la cita (asumido: es lectura, no columna
            nueva). Se consume una sola vez; citada de nuevo, `409`
            `SOLICITUD_NO_APLICABLE`.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        contexto:
          description: Cifras del momento de la solicitud, tal como se guardaron. No se recalculan (HDU-003 esc. 3).
          anyOf:
            - $ref: '#/components/schemas/DetalleExcedePresupuesto'
            - $ref: '#/components/schemas/DetalleExcedeOrdenado'
        renglones:
          description: Renglones de la requisición, si la entidad es una requisición.
          type: array
          items:
            $ref: '#/components/schemas/RenglonRequisicion'
        resuelta_por:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        resuelta_en:
          oneOf:
            - $ref: '#/components/schemas/FechaHora'
            - type: 'null'
        motivo_resolucion:
          type: [string, 'null']
        creado_en:
          $ref: '#/components/schemas/FechaHora'
    SolicitudResumen:
      type: object
      required: [id, motivo, regla, estado, sin_efecto, obra, solicitante, creado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        motivo:
          $ref: '#/components/schemas/MotivoSolicitud'
        regla:
          $ref: '#/components/schemas/ReglaId'
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        sin_efecto:
          type: boolean
        obra:
          $ref: '#/components/schemas/ObraResumen'
        tipo_partida:
          oneOf:
            - $ref: '#/components/schemas/TipoPartida'
            - type: 'null'
        solicitante:
          $ref: '#/components/schemas/UsuarioResumen'
        importe_solicitado:
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        excedente:
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        creado_en:
          $ref: '#/components/schemas/FechaHora'
    ListaSolicitudes:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudResumen'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'
    ContadorPendientes:
      type: object
      required: [pendientes]
      properties:
        pendientes:
          type: integer
          minimum: 0
    ResolucionSolicitud:
      type: object
      required: [decision, motivo]
      properties:
        decision:
          type: string
          enum: [AUTORIZAR, RECHAZAR]
        motivo:
          type: string
          minLength: 1
          maxLength: 2000
          description: Obligatorio también al autorizar (invariante 9).
    SolicitudExcedenteNueva:
      type: object
      description: >-
        (asumido) Una solicitud por renglón (`PA-16`): la solicitud guarda un
        `orden_compra_renglon_id` y su cantidad excedente. El cliente declara la
        cantidad entrante; el excedente lo recalcula el servidor.
      required: [motivo, orden_compra_id, folio_remision, orden_compra_renglon_id, cantidad_entrante]
      properties:
        motivo:
          type: string
          const: EXCEDE_ORDENADO
        orden_compra_id:
          $ref: '#/components/schemas/Uuid'
        folio_remision:
          type: string
          minLength: 1
        orden_compra_renglon_id:
          $ref: '#/components/schemas/Uuid'
        cantidad_entrante:
          $ref: '#/components/schemas/CantidadPositiva'
        observaciones:
          type: [string, 'null']

    # ---------------------------------------------------------------- bitácora
    AccionBitacora:
      type: string
      enum: [CREAR, ACTUALIZAR, EVALUAR, BLOQUEAR, AUTORIZAR, RECHAZAR, CANCELAR, EMITIR, AJUSTAR, REPROGRAMAR, CONGELAR, RECAPTURAR, DESCARTAR, CONFIRMAR, ANULAR, SUSPENDER, REACTIVAR, CERRAR, DESACTIVAR, LIBERAR, VALIDAR, DENEGAR]
      description: >-
        El mismo enumerado que `bitacora.accion` en el modelo de datos §10.
        `DENEGAR` asienta un `403` de un usuario autenticado, en una transacción
        propia.
    AsientoBitacora:
      type: object
      required: [id, entidad_tipo, entidad_id, accion, usuario, ocurrido_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        entidad_tipo:
          type: string
        entidad_id:
          $ref: '#/components/schemas/Uuid'
        accion:
          $ref: '#/components/schemas/AccionBitacora'
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'
        ocurrido_en:
          $ref: '#/components/schemas/FechaHora'
        datos_antes:
          type: [object, 'null']
          additionalProperties: true
        datos_despues:
          type: [object, 'null']
          additionalProperties: true
        motivo:
          type: [string, 'null']
        regla_negocio:
          oneOf:
            - $ref: '#/components/schemas/ReglaId'
            - type: 'null'
        obra_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    ListaBitacora:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/AsientoBitacora'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'

    # -------------------------------------------------------------- proveedores
    DiaSemana:
      type: integer
      minimum: 1
      maximum: 7
      description: ISO 8601, 1 = lunes. 4 = jueves, 6 = sábado.
    EstadoProveedor:
      type: string
      enum: [ACTIVO, DESACTIVADO, BAJA]
      description: >-
        `DESACTIVADO` sale del selector de órdenes nuevas y conserva sus órdenes;
        `BAJA` es la baja lógica definitiva, solo sin órdenes pendientes. Nunca
        hay borrado físico.
    ProveedorNuevo:
      type: object
      required: [nombre, rfc]
      properties:
        nombre:
          type: string
          minLength: 1
        rfc:
          type: string
          pattern: '^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$'
          description: Formato del RFC; no se valida contra el SAT.
        tope_consignacion:
          description: Se captura en el MVP; su regla (`RN-15`) es v1.1.
          oneOf:
            - $ref: '#/components/schemas/ImporteNoNegativo'
            - type: 'null'
        dia_corte:
          allOf:
            - $ref: '#/components/schemas/DiaSemana'
          default: 4
        dia_pago:
          allOf:
            - $ref: '#/components/schemas/DiaSemana'
          default: 6
    ProveedorCambios:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
        tope_consignacion:
          oneOf:
            - $ref: '#/components/schemas/ImporteNoNegativo'
            - type: 'null'
        dia_corte:
          $ref: '#/components/schemas/DiaSemana'
        dia_pago:
          $ref: '#/components/schemas/DiaSemana'
    Proveedor:
      type: object
      required: [id, nombre, rfc, dia_corte, dia_pago, estado, creado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        rfc:
          type: string
        tope_consignacion:
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        dia_corte:
          $ref: '#/components/schemas/DiaSemana'
        dia_pago:
          $ref: '#/components/schemas/DiaSemana'
        estado:
          $ref: '#/components/schemas/EstadoProveedor'
        creado_en:
          $ref: '#/components/schemas/FechaHora'
    ProveedorResumen:
      type: object
      required: [id, nombre, rfc]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        rfc:
          type: string
    ListaProveedores:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Proveedor'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'
    PedidosProveedorPorObra:
      type: object
      required: [proveedor, obras, total_general]
      properties:
        proveedor:
          $ref: '#/components/schemas/ProveedorResumen'
        obras:
          type: array
          items:
            type: object
            required: [obra, insumos, total]
            properties:
              obra:
                $ref: '#/components/schemas/ObraResumen'
              insumos:
                type: array
                items:
                  type: object
                  required: [insumo, cantidad, importe]
                  properties:
                    insumo:
                      $ref: '#/components/schemas/InsumoResumen'
                    cantidad:
                      $ref: '#/components/schemas/CantidadNoNegativa'
                    importe:
                      $ref: '#/components/schemas/Importe'
              total:
                $ref: '#/components/schemas/Importe'
        total_general:
          $ref: '#/components/schemas/Importe'

    # ------------------------------------------------ compras · órdenes de compra
    EstadoOrdenCompra:
      type: string
      enum: [ABIERTA, PARCIAL, CERRADA, CANCELADA]
      description: Derivado de las cantidades, salvo `CANCELADA`.
    OrdenCompraNueva:
      type: object
      required: [requisicion_id, proveedor_id, fecha_compromiso]
      properties:
        requisicion_id:
          $ref: '#/components/schemas/Uuid'
        proveedor_id:
          description: Obligatorio; sin él, `422` (HDU-004 esc. 8).
          allOf:
            - $ref: '#/components/schemas/Uuid'
        fecha_compromiso:
          description: Fecha comprometida de entrega para todos los renglones, salvo los que se indiquen aparte.
          allOf:
            - $ref: '#/components/schemas/Fecha'
        renglones:
          description: (asumido) Fecha por renglón cuando difiere de la general. Los renglones, cantidades y costos se copian de la requisición y no se capturan aquí.
          type: array
          items:
            type: object
            required: [requisicion_renglon_id, fecha_compromiso]
            properties:
              requisicion_renglon_id:
                $ref: '#/components/schemas/Uuid'
              fecha_compromiso:
                $ref: '#/components/schemas/Fecha'
    RenglonOrdenCompra:
      type: object
      required: [id, insumo, cantidad_ordenada, cantidad_recibida, cantidad_excedente_autorizada, saldo_pendiente, costo_unitario, importe, fecha_compromiso, primera_fecha_compromiso, reprogramaciones]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        insumo:
          $ref: '#/components/schemas/InsumoResumen'
        cantidad_ordenada:
          $ref: '#/components/schemas/CantidadNoNegativa'
        cantidad_recibida:
          description: Todo lo recibido, excedente autorizado incluido.
          allOf:
            - $ref: '#/components/schemas/CantidadNoNegativa'
        cantidad_excedente_autorizada:
          description: >-
            Excedente sobre lo ordenado ya recibido con autorización de Dirección
            General (`RN-07`, `PA-16`). Lo incrementa la **entrada** que consume la
            autorización, no la resolución. Invariante 2:
            `cantidad_recibida ≤ cantidad_ordenada + cantidad_excedente_autorizada`.
          allOf:
            - $ref: '#/components/schemas/CantidadNoNegativa'
        saldo_pendiente:
          description: '`max(cantidad_ordenada − cantidad_recibida, 0)`: el excedente no deja saldo negativo.'
          allOf:
            - $ref: '#/components/schemas/CantidadNoNegativa'
        costo_unitario:

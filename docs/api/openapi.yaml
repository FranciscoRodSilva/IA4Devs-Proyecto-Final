  # ---------------------------------------------------------- compras · requisiciones
  /requisiciones:
    post:
      tags: [compras]
      operationId: crear_requisicion
      summary: Crea una requisición en borrador o la crea y la envía en un paso
      description: >-
        Con `enviar: false` queda en `BORRADOR`: no evalúa, no toma bloqueos, no
        consume (HDU-002 esc. 2). Con `enviar: true` evalúa `RN-03` en la misma
        transacción, con `SELECT … FOR UPDATE` sobre `presupuesto_control` y
        `explosion_presupuesto` ordenados por tipo de partida (ADR-004):


        - **Cabe** → `201` en `EVALUADA` (crear y enviar en un paso es `201`;
        enviar un borrador ya existente es `200`, en `enviar_requisicion`).

        - **Excede en importe o en volumen, o pide un insumo ajeno a la explosión**
        → la requisición **se persiste** en `BLOQUEADA`, se crea la solicitud de
        autorización para `DIRECCION_GENERAL` y responde `409` `RN-03` con la
        acción `VER_SOLICITUD_AUTORIZACION` (`GET` a la solicitud ya creada). No es
        un rechazo: es una bifurcación.

        - **Obra sin línea base congelada** → `409` `CONFLICTO`
        `SIN_LINEA_BASE_CONGELADA`; **sin tope de control capturado** → `409`
        `CONFLICTO` `SIN_PRESUPUESTO_CONTROL` con la acción de capturarlo
        (HDU-001 esc. 16). No hay contra qué evaluar, así que no es `RN-03`: no
        se persiste nada ni se asienta como excepción.

        - **Vence `lock_timeout`** → `409` de tipo `CONCURRENCIA` con la acción de
        reintentar (`RNF-16`). Nada se persiste.


        Sin `obra_id` o sin `tipo_partida_id` responde `422` citando `RN-02` en el
        error del campo (esc. 6). Una cantidad o un costo no positivo, `422`
        señalando el renglón (esc. 10).

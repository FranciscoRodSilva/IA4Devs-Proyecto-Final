          csrf: []
      x-roles: [DIRECCION_GENERAL]
      x-reglas: [RN-03, RN-04, RN-07]
      x-escenarios: ['HDU-003 esc. 4', 'HDU-003 esc. 5', 'HDU-003 esc. 6', 'HDU-003 esc. 7', 'HDU-003 esc. 8', 'HDU-003 esc. 9', 'HDU-003 esc. 10']

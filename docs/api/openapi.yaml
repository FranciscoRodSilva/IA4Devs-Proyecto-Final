              orden_compra_renglon_id:
                $ref: '#/components/schemas/Uuid'
              cantidad:
                $ref: '#/components/schemas/CantidadPositiva'
              solicitud_autorizacion_id:
                description: >-
                  Solicitud `EXCEDE_ORDENADO` `AUTORIZADA` de este renglón que
                  ampara la parte que excede el saldo (`RN-07`, `PA-16`; HDU-005
                  esc. 21). Sin ella, cualquier excedente se rechaza con `409`
                  `RN-07`. Se consume una sola vez.
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
        observaciones:
          type: [string, 'null']
    SaldoRenglon:
      type: object
      required: [orden_compra_renglon_id, cantidad_ordenada, cantidad_recibida, cantidad_excedente_autorizada, saldo_pendiente]

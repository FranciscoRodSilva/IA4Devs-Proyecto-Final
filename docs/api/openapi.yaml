openapi: 3.1.0
info:
  title: CIMENTA · API de la fase 1 (hilo vertical)
  version: 0.1.0-borrador
  summary: Borrador escrito a mano del contrato HTTP del hilo vertical.
  description: >-
    Contrato de diseño de la fase 1 de CIMENTA: importar la línea base, levantar
    una requisición, bloquearla o autorizarla, emitir la orden de compra, recibir
    el material y ver el semáforo.


    Es un **borrador escrito a mano** y no sustituye al OpenAPI que publica FastAPI:
    el publicado es lo que el servidor responde, este es el contrato que el código
    implementa, y TKT-061 compara los dos para las rutas del hilo y falla el
    pipeline si divergen. **Si divergen, manda el borrador**: se corrige el código,
    o el borrador cambia en el mismo PR. El porqué está en
    `docs/07-especificacion-api.md`.


    Reglas que ningún esquema de este archivo rompe:

    - **Importes, precios, cantidades, rendimientos y porcentajes son cadenas
      decimales** (`type: string`, `format: decimal`). Nunca `number`: un número
      JSON pasa por el flotante de JavaScript (ADR-007).

    - **Los porcentajes son fracciones**: `0.150000` es 15 %.

    - Identificadores UUID. Marcas de tiempo `date-time` con zona; fechas de
      negocio sin hora (remisión, compromiso de entrega) como `date`.

    - Sesión por cookie opaca con estado en servidor (ADR-014) y token de doble
      envío en todo método que muta estado (`RNF-05`).

    - Los archivos nunca atraviesan el API: se emite una URL prefirmada (ADR-016).

    - Las transiciones de estado son sub-recursos `POST`, nunca un `PATCH` del
      campo `estado`.


    Extensiones propias en cada operación: `x-roles` (roles del PRD §4 que pueden
    invocarla), `x-reglas` (reglas `RN-xx` que evalúa), `x-escenarios`
    (escenarios de `docs/04-historias-usuario.md` que cubre) y `x-tickets`
    (tickets que la implementan). `x-sin-exito: true` marca la única operación
    que nunca responde `2xx` (`cerrar_orden_compra`): TKT-061 la excluye de la
    comparación de códigos de éxito.


    Las `acciones` de un rechazo se filtran por los roles de quien llama: nunca
    se ofrece una acción que le daría `403`. La única excepción es `REINTENTAR`
    de un `409` `CONCURRENCIA`, que repite la operación que quien llama acaba de
    invocar y que `api/` ya autorizó por su rol (TKT-005, supuesto 14 de la
    especificación de la API).
  contact:
    name: CIMENTA
servers:
  - url: /api/v1
    description: Base de todas las rutas. El SPA y el API comparten origen.
security:
  - sesion: []
tags:
  - name: identidad
    description: Sesión, usuario actual y token CSRF.
  - name: presupuesto
    description: Catálogos, obras, importación, línea base y presupuesto de control.
  - name: archivos
    description: Confirmación y descarga de archivos mediante URL prefirmada.
  - name: compras
    description: Disponible, requisiciones, solicitudes de autorización y órdenes de compra.
  - name: proveedores
    description: Catálogo de proveedores.
  - name: almacen
    description: Entradas de almacén, correcciones, saldos pendientes y libro mayor.
  - name: auditoria
    description: Consulta de la bitácora de solo-anexado.
  - name: analitica
    description: Semáforo de obra. Solo lectura.

paths:
  # ------------------------------------------------------------------ identidad
  /sesion/csrf:
    get:
      tags: [identidad]
      operationId: obtener_token_csrf
      summary: Emite el token CSRF de doble envío
      description: >-
        Fija la cookie `cimenta_csrf` (legible desde JavaScript, **no** `HttpOnly`)
        y devuelve el mismo valor en el cuerpo. El cliente lo reenvía en la cabecera
        `X-CSRF-Token` en todo método que muta estado, incluido el inicio de sesión.
        Se rota al iniciar y al cerrar sesión. Existe como ruta propia porque el
        inicio de sesión también muta estado y necesita token antes de que haya
        sesión. Es una de las **dos únicas rutas sin sesión**, con `iniciar_sesion`
        (TKT-006 las lista).
      security: []
      x-roles: []
      x-reglas: []
      x-escenarios: []
      x-tickets: [TKT-006, TKT-057]
      responses:
        '200':
          description: Token emitido.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCsrf'
            X-Correlacion-Id:
              $ref: '#/components/headers/XCorrelacionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCsrf'

  /sesion:
    post:
      tags: [identidad]
      operationId: iniciar_sesion
      summary: Inicia sesión con correo y contraseña
      description: >-
        Verifica la contraseña con Argon2id **siempre**, exista o no el correo, para
        que el tiempo de respuesta no revele qué cuentas existen. Crea la fila en
        `sesion` y devuelve la cookie `cimenta_sesion` con un identificador opaco,
        `HttpOnly`, `Secure`, `SameSite=Lax` (`RNF-01`, `RNF-02`). Cada intento se
        asienta en `intento_acceso` (`RNF-04`). Es, con `obtener_token_csrf`, una de
        las dos únicas rutas sin sesión. Sus rechazos —credenciales inválidas o
        token CSRF ausente— son anónimos: van a `intento_acceso` y al registro
        técnico, **no a la bitácora**, que exige usuario autenticado.
      security:
        - csrf: []
      x-roles: []
      x-reglas: []
      x-escenarios: []
      x-tickets: [TKT-006, TKT-057]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesInicio'
      responses:
        '200':
          description: Sesión abierta.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSesion'
            X-Correlacion-Id:
              $ref: '#/components/headers/XCorrelacionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/ErrorDeForma'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    get:
      tags: [identidad]
      operationId: obtener_sesion_actual
      summary: Devuelve el usuario y los roles de la sesión vigente
      description: >-
        Los roles se leen de la base en cada petición: retirar un rol surte efecto
        en la siguiente (ADR-014). La navegación del cliente se construye con esta
        respuesta.
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS, RESIDENTE, COMPRAS, ALMACEN, ADMINISTRACION]
      x-reglas: []
      x-escenarios: []
      x-tickets: [TKT-006]
      responses:
        '200':
          description: Sesión vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /sesion/cierre:
    post:
      tags: [identidad]
      operationId: cerrar_sesion
      summary: Cierra la sesión vigente
      description: >-
        Escribe `sesion.revocada_en`; **nunca borra la fila**, que es dato de
        auditoría. Por eso es una transición `POST` y no un `DELETE`.
      security:
        - sesion: []
          csrf: []
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS, RESIDENTE, COMPRAS, ALMACEN, ADMINISTRACION]
      x-reglas: []
      x-escenarios: []
      x-tickets: [TKT-006]
      responses:
        '204':
          description: Sesión revocada. La cookie se expira en la respuesta.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSesion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  # ---------------------------------------------------------- presupuesto · catálogos
  /tipos-partida:
    get:
      tags: [presupuesto]
      operationId: listar_tipos_partida
      summary: Lista los cuatro tipos de partida
      description: >-
        Son las cuatro bolsas de control por obra (PA-01). Catálogo sembrado por
        TKT-010; no se pagina.
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS, RESIDENTE, COMPRAS, ALMACEN, ADMINISTRACION]
      x-reglas: []
      x-escenarios: ['HDU-002 esc. 1']
      x-tickets: [TKT-012]
      responses:
        '200':
          description: Catálogo completo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoPartida'
              example:
                - id: 0c9d8e7f-6a5b-4c3d-8e2f-1a0b9c8d7e6f
                  clave: MUROS
                  nombre: MUROS
                - id: 1d0e9f8a-7b6c-4d5e-9f3a-2b1c0d9e8f7a
                  clave: PLAFONES_Y_CAJILLOS
                  nombre: PLAFONES Y CAJILLOS
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /insumos:
    get:
      tags: [presupuesto]
      operationId: listar_insumos
      summary: Lista el catálogo global de insumos
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS, RESIDENTE, COMPRAS, ALMACEN, ADMINISTRACION]
      x-reglas: []
      x-escenarios: ['HDU-001 esc. 10']
      x-tickets: [TKT-012]
      parameters:
        - name: q
          in: query
          description: Busca por código o descripción.
          schema:
            type: string
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoInsumo'
        - name: creado_en_importacion
          in: query
          description: Solo los dados de alta por un importador, pendientes de revisar.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de insumos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaInsumos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ErrorDeForma'

  # ------------------------------------------------------------ presupuesto · obras
  /obras:
    post:
      tags: [presupuesto]
      operationId: crear_obra
      summary: Da de alta una obra en estado PLANEACION
      description: >-
        Retención de destajo y fondo de garantía son **dos parámetros distintos** y
        viven en la obra (PA-02). El IVA acreditable es por obra (`RN-25`, PA-05).
        `umbral_alerta_pct` es el umbral de desviación relativa que separa
        `AMARILLO` de `ROJO` en el semáforo, y la alerta (F7.3) sale con `ROJO`
        (`PA-18`); es opcional y, sin él, toda desviación positiva es `ROJO`.
      security:
        - sesion: []
          csrf: []
      x-roles: [DIRECTOR_PROYECTOS, DIRECCION_GENERAL]
      x-reglas: [RN-25]
      x-escenarios: ['HDU-001 esc. 2', 'HDU-001 esc. 3']
      x-tickets: [TKT-012]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObraNueva'
            example:
              codigo: AP-058-25
              nombre: Union Square F2
              domicilio: Av. Insurgentes Sur 1458, Ciudad de México
              tipo_contrato: PRECIO_ALZADO_MAXIMO_GARANTIZADO
              retencion_destajo_pct: '0.150000'
              fondo_garantia_pct: '0.050000'
              iva_acreditable: false
              umbral_alerta_pct: '0.150000'
      responses:
        '201':
          description: Obra creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obra'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: El código ya lo usa otra obra (HDU-001 esc. 3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConflictoEstado'
              example:
                tipo: CONFLICTO
                codigo: CODIGO_OBRA_DUPLICADO
                mensaje: Ya existe una obra con el código AP-058-25.
                detalle:
                  obra_existente_id: 7b1e4c2a-5d3f-4a8b-9c6e-1f2a3b4c5d6e
                  obra_existente: AP-058-25 · Union Square F2
                acciones:
                  - clave: VER_OBRA
                    metodo: GET
                    ruta: /api/v1/obras/7b1e4c2a-5d3f-4a8b-9c6e-1f2a3b4c5d6e
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890
        '422':
          $ref: '#/components/responses/ErrorDeForma'
    get:
      tags: [presupuesto]
      operationId: listar_obras
      summary: Lista las obras
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS, RESIDENTE, COMPRAS, ALMACEN, ADMINISTRACION]
      x-reglas: []
      x-escenarios: ['HDU-001 esc. 2']
      x-tickets: [TKT-012]
      parameters:
        - name: estado
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EstadoObra'
          style: form
          explode: true
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
      responses:
        '200':
          description: Página de obras.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaObras'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ErrorDeForma'

  /obras/{obra_id}:
    parameters:
      - $ref: '#/components/parameters/ObraId'
    get:
      tags: [presupuesto]
      operationId: obtener_obra
      summary: Devuelve una obra
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS, RESIDENTE, COMPRAS, ALMACEN, ADMINISTRACION]
      x-reglas: []
      x-escenarios: []
      x-tickets: [TKT-012]
      responses:
        '200':
          description: La obra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obra'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [presupuesto]
      operationId: actualizar_obra
      summary: Modifica los datos de una obra
      description: >-
        (asumido) El `codigo` y el `tipo_contrato` no se modifican: son la identidad
        de la obra y lo que otras pantallas citan. El estado tampoco: se cambia con
        las transiciones `suspension`, `reactivacion` y `cierre`. Todo cambio se
        asienta en la bitácora con el valor anterior.
      security:
        - sesion: []
          csrf: []
      x-roles: [DIRECTOR_PROYECTOS, DIRECCION_GENERAL]
      x-reglas: [RN-25]
      x-escenarios: []
      x-tickets: [TKT-012]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObraCambios'
      responses:
        '200':
          description: Obra actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obra'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorDeForma'
    delete:
      tags: [presupuesto]
      operationId: eliminar_obra
      summary: Elimina una obra sin historial
      description: >-
        Solo procede si la obra no tiene línea base congelada ni movimientos. Con
        historial responde `409` y ofrece suspenderla o cerrarla: ningún dato
        histórico se pierde (HDU-001 esc. 20).
      security:
        - sesion: []
          csrf: []
      x-roles: [DIRECTOR_PROYECTOS, DIRECCION_GENERAL]
      x-reglas: [RN-01]
      x-escenarios: ['HDU-001 esc. 20']
      x-tickets: [TKT-012]
      responses:
        '204':
          description: Obra eliminada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La obra tiene historial y no se elimina.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConflictoEstado'
              example:
                tipo: CONFLICTO
                codigo: OBRA_CON_HISTORIAL
                mensaje: La obra AP-058-25 tiene línea base congelada y movimientos; se suspende o se cierra, no se elimina.
                detalle:
                  linea_base_congelada: true
                  movimientos: 42
                acciones:
                  - clave: SUSPENDER_OBRA
                    metodo: POST
                    ruta: /api/v1/obras/7b1e4c2a-5d3f-4a8b-9c6e-1f2a3b4c5d6e/suspension
                  - clave: CERRAR_OBRA
                    metodo: POST
                    ruta: /api/v1/obras/7b1e4c2a-5d3f-4a8b-9c6e-1f2a3b4c5d6e/cierre
                correlacion_id: c3d4e5f6-a7b8-4901-8cde-f01234567890

  /obras/{obra_id}/suspension:
    parameters:
      - $ref: '#/components/parameters/ObraId'
    post:
      tags: [presupuesto]
      operationId: suspender_obra
      summary: Pasa una obra ACTIVA a SUSPENDIDA
      security:
        - sesion: []
          csrf: []
      x-roles: [DIRECTOR_PROYECTOS, DIRECCION_GENERAL]
      x-reglas: []
      x-escenarios: ['HDU-001 esc. 20']
      x-tickets: [TKT-012]
      requestBody:
        $ref: '#/components/requestBodies/MotivoObligatorio'
      responses:
        '200':
          description: Obra suspendida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obra'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorDeForma'

  /obras/{obra_id}/reactivacion:
    parameters:
      - $ref: '#/components/parameters/ObraId'
    post:
      tags: [presupuesto]
      operationId: reactivar_obra
      summary: Devuelve una obra SUSPENDIDA a ACTIVA
      description: >-
        (asumido) La máquina de estados de TKT-012 no declara la vuelta de
        `SUSPENDIDA` a `ACTIVA`; se incluye porque una suspensión sin salida sería
        un cierre con otro nombre. Pendiente de confirmar.
      security:
        - sesion: []
          csrf: []
      x-roles: [DIRECTOR_PROYECTOS, DIRECCION_GENERAL]
      x-reglas: []
      x-escenarios: []
      x-tickets: [TKT-012]
      requestBody:
        $ref: '#/components/requestBodies/MotivoObligatorio'
      responses:
        '200':
          description: Obra reactivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obra'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorDeForma'

  /obras/{obra_id}/cierre:
    parameters:
      - $ref: '#/components/parameters/ObraId'
    post:
      tags: [presupuesto]
      operationId: cerrar_obra
      summary: Pasa una obra a CERRADA
      security:
        - sesion: []
          csrf: []
      x-roles: [DIRECTOR_PROYECTOS, DIRECCION_GENERAL]
      x-reglas: []
      x-escenarios: ['HDU-001 esc. 20']
      x-tickets: [TKT-012]
      requestBody:
        $ref: '#/components/requestBodies/MotivoObligatorio'
      responses:
        '200':
          description: Obra cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obra'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorDeForma'

  # ------------------------------------------------------------------- archivos
  /archivos/{archivo_id}:
    parameters:
      - $ref: '#/components/parameters/ArchivoId'
    get:
      tags: [archivos]
      operationId: obtener_archivo
      summary: Devuelve los metadatos de un archivo
      description: Nunca devuelve los bytes ni una ruta del almacén.
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS]
      x-reglas: []
      x-escenarios: ['HDU-001 esc. 24']
      x-tickets: [TKT-059]
      responses:
        '200':
          description: Metadatos del archivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archivo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /archivos/{archivo_id}/confirmacion:
    parameters:
      - $ref: '#/components/parameters/ArchivoId'
    post:
      tags: [archivos]
      operationId: confirmar_archivo
      summary: Confirma que el objeto subido coincide con lo declarado
      description: >-
        Paso dos de la escritura en dos pasos (ADR-016, regla 2). El servidor
        comprueba contra el objeto **realmente almacenado**: que exista, que su
        tamaño y su SHA-256 coincidan con lo declarado al crear la fila, y que su
        tipo —**leído de los bytes**, nunca de la extensión ni del `Content-Type` del
        `PUT`— esté en la lista blanca. SVG está prohibido. Para `.xlsx` la
        comprobación es estructural: el ZIP debe contener `[Content_Types].xml` con
        la parte de libro. Si todo coincide reescribe el `Content-Type` del objeto,
        pasa la fila a `DISPONIBLE` y asienta el hash en la bitácora (`RNF-19`). Si
        no, la fila sigue `PENDIENTE` y el barrido la retira.


        - Tamaño almacenado distinto del declarado → `409` `ARCHIVO_TAMANO_DISTINTO`.

        - SHA-256 distinto → `409` `ARCHIVO_HASH_DISTINTO` (HDU-001 esc. 25).


        `ARCHIVO_TIPO_NO_PERMITIDO` (esc. 26). TKT-066 reutiliza el mismo código en
        la fase 2.


        Un tamaño que excede el límite ya se rechaza con `422` **al dar de alta**
        la fila, sobre lo declarado; aquí solo se compara lo almacenado con lo
        declarado. Solo puede confirmar quien subió el archivo. Confirmar dos veces
        un archivo ya `DISPONIBLE` devuelve `200` con la misma fila (idempotente).

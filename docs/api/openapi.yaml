  # ------------------------------------------------------------------ analitica
  /obras/{obra_id}/semaforo:
    parameters:
      - $ref: '#/components/parameters/ObraId'
    get:
      tags: [analitica]
      operationId: obtener_semaforo
      summary: Semáforo de la obra, una fila por tipo de partida
      description: >-
        Cuatro filas por obra, no una por ubicación (PA-01), más la fila de nómina
        a nivel de obra, no imputada a partida (PA-10). Se calcula en tiempo de
        consulta y responde en menos de 2 s (`RNF-15`).


        **El consumido no se recalcula aquí.** `requisiciones_vivas`,
        `comprometido`, `ejercido`, `consumido` y `disponible` de cada fila salen
        de la interfaz publicada de `compras`, dueño de ese cálculo, leída con el
        rol de solo lectura: es la misma definición que aplica `RN-03` y la misma
        que responde `obtener_disponible`, y un test verifica que coinciden al
        céntimo.


        **Metadato de fuentes** (ADR-017): cada fuente declara `REAL`, `SIMULADA` o
        `SIN_DATOS`. En la fase 1 destajo, nómina y avance físico salen del
        adaptador `SIMULADO` en `local`, `pruebas` y `demostracion`, y del
        adaptador `VACIO` —todas `SIN_DATOS`— en `produccion`, donde el simulado no
        arranca. `AVANCE_FISICO` cubre alcance y ejecutado: no hay fuente aparte
        para el alcance. `cifra_parcial` es `true` en cuanto **alguna** fuente no
        es `REAL`, y el letrero de datos simulados de la interfaz se genera desde
        `fuentes[]`, no es un texto fijo.


        **Ejercido real y simulado viajan separados.** `ejercido` es **solo
        real**, y es el término que entra en `consumido`; lo simulado va aparte en
        `ejercido_simulado`, `null` si ninguna fuente de ejercido de la fila es
        `SIMULADA`. Lo simulado **nunca** entra en `consumido` ni en `disponible`
        (ADR-017, regla 1).


        **Avance físico y desviación son `null`, no cero, sin avance validado**: el
        denominador es el alcance de destajo, nunca `SUM(avance.m2_contrato)`
        (modelo de datos §15), y la fila sale `SIN_AVANCE_MEDIDO`. La desviación
        se calcula con `ejercido + ejercido_simulado` y lleva `ilustrativa: true`
        si alguna de sus entradas es `SIMULADA`. **Una desviación ilustrativa no
        emite alerta**: `alerta` es `false` y `listar_alertas_semaforo` la excluye.


        **Color por umbral** (`PA-18`, resuelta el 2026-10-17; corte asumido sin
        bloqueo): `VERDE` con desviación ≤ 0, `AMARILLO` con desviación positiva
        y relativa ≤ `obra.umbral_alerta_pct`, `ROJO` por encima del umbral
        —o con cualquier desviación positiva si la obra no tiene umbral—.
        `SIN_AVANCE_MEDIDO` es un estado aparte, no un color. La alerta sale con
        `ROJO` (esc. 16: una partida `AMARILLO` no alerta).


        Sin línea base congelada responde `409` `CONFLICTO`
        `SIN_LINEA_BASE_CONGELADA` con la acción de congelarla y sin ninguna cifra
        (HDU-006 esc. 8). Un usuario sin el rol recibe `403` sin importes (esc. 12).
      x-roles: [DIRECCION_GENERAL, DIRECTOR_PROYECTOS]
      x-reglas: [RN-21, RN-03]
      x-escenarios: ['HDU-006 esc. 1', 'HDU-006 esc. 2', 'HDU-006 esc. 3', 'HDU-006 esc. 4', 'HDU-006 esc. 5', 'HDU-006 esc. 6', 'HDU-006 esc. 8', 'HDU-006 esc. 9', 'HDU-006 esc. 10', 'HDU-006 esc. 11', 'HDU-006 esc. 12', 'HDU-006 esc. 13', 'HDU-006 esc. 14', 'HDU-006 esc. 15', 'HDU-006 esc. 16']
      x-tickets: [TKT-040, TKT-039, TKT-060]
      responses:
        '200':
          description: El semáforo.
          content:

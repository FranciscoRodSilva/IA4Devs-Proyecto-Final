    ListaMovimientos:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/MovimientoInventario'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'

    # ---------------------------------------------------------------- analítica
    EstadoFuente:
      type: string
      enum: [REAL, SIMULADA, SIN_DATOS]
      description: >-
        Procedencia de una cifra (ADR-017). `SIMULADA` la produce el adaptador
        `SIMULADO` (solo `local`, `pruebas` y `demostracion`) y se rotula *dato
        simulado*; `SIN_DATOS` la produce el adaptador `VACIO`, el único admitido
        en `produccion` durante la fase 1. Ninguna de las dos entra nunca en
        `consumido` ni en `disponible`.
    FuenteSemaforo:
      type: object
      required: [fuente, estado]
      properties:
        fuente:
          type: string
          enum: [PRESUPUESTADO, REQUISICIONES_VIVAS, COMPROMETIDO, MATERIALES, DESTAJO, NOMINA, AVANCE_FISICO]
          description: '`AVANCE_FISICO` cubre el alcance y lo ejecutado: no hay fuente aparte para el alcance.'
        estado:
          $ref: '#/components/schemas/EstadoFuente'
    EjercidoPartida:
      type: object
      description: >-
        **Solo real.** Es el término `ejercido` de `consumido`, tal como lo
        calcula `compras` con el puerto `FuenteEjercido`. Una fuente que no es
        `REAL` aporta cero aquí; lo simulado va en `FilaSemaforo.ejercido_simulado`.
      required: [materiales, destajo, total]
      properties:
        materiales:
          $ref: '#/components/schemas/Importe'
        destajo:
          description: Destajo real, por el tipo de partida de su etapa (PA-08). Cero en la fase 1.
          allOf:
            - $ref: '#/components/schemas/Importe'
        total:
          $ref: '#/components/schemas/Importe'
    AvanceFisico:
      type: object
      required: [porcentaje, fuente]
      properties:
        porcentaje:
          description: >-
            m² validados ÷ alcance de destajo. **`null`, no cero, sin avance
            validado**; la interfaz lo presenta como *sin avance medido*.
          oneOf:
            - $ref: '#/components/schemas/Porcentaje'
            - type: 'null'
        fuente:
          $ref: '#/components/schemas/EstadoFuente'
    Desviacion:
      type: object
      required: [importe, relativa, ilustrativa]
      properties:
        importe:
          description: >-
            `(ejercido.total + ejercido_simulado) − presupuestado × avance`, con
            `ejercido_simulado` como cero si es `null`. `null` si el avance es
            `null`: no calculable, que no es cero.
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        relativa:
          description: (asumido) `importe ÷ (presupuestado × avance)`, la que se compara con `obra.umbral_alerta_pct`. `null` si no es calculable.
          oneOf:
            - $ref: '#/components/schemas/Porcentaje'
            - type: 'null'
        ilustrativa:
          type: boolean
          description: '`true` si alguna de sus entradas es `SIMULADA` (ADR-017, regla 3). Una desviación ilustrativa no emite alerta.'
    FilaSemaforo:
      type: object
      required: [tipo_partida, presupuestado, requisiciones_vivas, comprometido, ejercido, ejercido_simulado, consumido, disponible, avance_fisico, desviacion, estado, alerta]
      properties:
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
        presupuestado:
          $ref: '#/components/schemas/Importe'
        requisiciones_vivas:
          description: De la interfaz publicada de `compras`. Primer sumando del consumido.
          allOf:
            - $ref: '#/components/schemas/Importe'
        comprometido:
          $ref: '#/components/schemas/Importe'
        ejercido:
          $ref: '#/components/schemas/EjercidoPartida'
        ejercido_simulado:
          description: >-
            Ejercido de fuentes `SIMULADA` de la partida (destajo en la fase 1).
            `null` si ninguna fuente de ejercido es `SIMULADA`. La interfaz lo
            pinta en su propia columna marcada, nunca sumado al real.
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        consumido:
          description: '`requisiciones_vivas + comprometido + ejercido.total`, de la interfaz publicada de `compras`. Solo real.'
          allOf:
            - $ref: '#/components/schemas/Importe'
        disponible:
          description: '`presupuestado − consumido`. Coincide al céntimo con `obtener_disponible`.'
          allOf:
            - $ref: '#/components/schemas/Importe'
        avance_fisico:
          $ref: '#/components/schemas/AvanceFisico'
        desviacion:
          $ref: '#/components/schemas/Desviacion'
        estado:
          type: string
          enum: [VERDE, AMARILLO, ROJO, SIN_AVANCE_MEDIDO]
          description: >-
            Tres colores, `VERDE`, `AMARILLO` y `ROJO` (`PA-18`, resuelta el
            2026-10-17), y un cuarto valor que **no es un color**:
            `SIN_AVANCE_MEDIDO`, con desviación `null`, porque sin avance no hay
            juicio. El campo es uno solo para que la fila tenga siempre un
            estado; la interfaz pinta los tres colores y muestra
            `SIN_AVANCE_MEDIDO` como estado neutro, sin color. Corte **(asumido,
            sin bloqueo)**: `VERDE` con desviación ≤ 0; `AMARILLO` con
            desviación > 0 y relativa ≤ `obra.umbral_alerta_pct`; `ROJO` con
            relativa > umbral. Si la obra no tiene umbral, toda desviación > 0
            es `ROJO`. Lo calcula el servidor; el cliente no compara nada.
        alerta:
          type: boolean
          description: >-
            `true` cuando la fila es `ROJO` (F7.3, `PA-18`). Siempre `false` si
            la desviación es ilustrativa: una desviación calculada con una
            entrada `SIMULADA` colorea la fila pero no emite alerta.
    FilaNomina:
      type: object
      required: [importe, fuente, no_imputada_a_partida]
      properties:
        importe:
          description: '`null` con fuente `SIN_DATOS`.'
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        fuente:
          $ref: '#/components/schemas/EstadoFuente'
        no_imputada_a_partida:
          type: boolean
          const: true
          description: Entra en el total de la obra; no se reparte entre partidas ni afecta a sus desviaciones (PA-10).
    TotalesSemaforo:
      type: object
      required: [presupuestado, requisiciones_vivas, comprometido, consumido, disponible, ejercido_partidas, ejercido_nomina, ejercido_total, ejercido_simulado]
      properties:
        presupuestado:
          $ref: '#/components/schemas/Importe'
        requisiciones_vivas:
          $ref: '#/components/schemas/Importe'
        comprometido:
          $ref: '#/components/schemas/Importe'
        consumido:
          $ref: '#/components/schemas/Importe'
        disponible:
          $ref: '#/components/schemas/Importe'
        ejercido_partidas:
          description: Suma de `ejercido.total` de las filas. Solo real.
          allOf:
            - $ref: '#/components/schemas/Importe'
        ejercido_nomina:
          description: Nómina real; `null` si su fuente no es `REAL`.
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
        ejercido_total:
          description: '`ejercido_partidas + ejercido_nomina`. Solo real.'
          allOf:
            - $ref: '#/components/schemas/Importe'
        ejercido_simulado:
          description: Todo lo simulado de la obra, partidas y nómina. `null` si ninguna fuente es `SIMULADA`.
          oneOf:
            - $ref: '#/components/schemas/Importe'
            - type: 'null'
    Semaforo:
      type: object
      required: [obra, linea_base, calculado_en, cifra_parcial, fuentes, umbral_alerta_pct, partidas, nomina, totales]
      properties:
        obra:
          $ref: '#/components/schemas/ObraResumen'
        linea_base:
          type: object
          required: [id, version]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            version:
              type: integer
        calculado_en:
          $ref: '#/components/schemas/FechaHora'
        cifra_parcial:
          type: boolean
          description: '`true` si **alguna** fuente no es `REAL`: la cifra no se presenta como costo real completo (HDU-006 esc. 6).'
        fuentes:
          type: array
          description: De aquí se genera el letrero de datos simulados o sin datos de la interfaz.
          items:
            $ref: '#/components/schemas/FuenteSemaforo'
        umbral_alerta_pct:
          description: '`obra.umbral_alerta_pct` (F7.3): separa `AMARILLO` de `ROJO`. `null`: toda desviación positiva es `ROJO`.'
          oneOf:
            - $ref: '#/components/schemas/Porcentaje'
            - type: 'null'
        partidas:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/FilaSemaforo'
        nomina:
          $ref: '#/components/schemas/FilaNomina'
        totales:
          $ref: '#/components/schemas/TotalesSemaforo'
    DesglosePartida:
      type: object
      required: [obra_id, tipo_partida, fuentes, por_fuente, por_insumo, por_ubicacion]
      properties:
        obra_id:
          $ref: '#/components/schemas/Uuid'
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
        fuentes:
          type: array
          items:
            $ref: '#/components/schemas/FuenteSemaforo'
        por_fuente:
          type: array
          items:
            type: object
            required: [fuente, importe, estado]
            properties:
              fuente:
                type: string
                enum: [MATERIALES, DESTAJO]
              importe:
                $ref: '#/components/schemas/Importe'
              estado:
                $ref: '#/components/schemas/EstadoFuente'
        por_insumo:
          type: array
          items:
            type: object
            required: [insumo, cantidad_presupuestada, cantidad_ejercida, importe_ejercido]
            properties:
              insumo:
                $ref: '#/components/schemas/InsumoResumen'
              cantidad_presupuestada:
                $ref: '#/components/schemas/CantidadNoNegativa'
              cantidad_ejercida:
                $ref: '#/components/schemas/Cantidad'
              importe_ejercido:
                $ref: '#/components/schemas/Importe'
        por_ubicacion:
          description: Por nivel y, dentro de cada nivel, por área. Se consulta, pero no es el nivel de control (PA-01).
          type: array
          items:
            type: object
            required: [nivel, importe_venta, avance_fisico, areas]
            properties:
              nivel:
                type: string
              importe_venta:
                $ref: '#/components/schemas/Importe'
              avance_fisico:
                $ref: '#/components/schemas/AvanceFisico'
              areas:
                type: array
                items:
                  type: object
                  required: [area, importe_venta, avance_fisico]
                  properties:
                    area:
                      type: string
                    importe_venta:
                      $ref: '#/components/schemas/Importe'
                    avance_fisico:
                      $ref: '#/components/schemas/AvanceFisico'
    MovimientoPartida:
      type: object
      required: [fecha, fuente_costo, tipo, cantidad, unidad, importe, motivo, estado_fuente, documento_origen, responsable]
      properties:
        id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        fecha:
          $ref: '#/components/schemas/FechaHora'
        fuente_costo:
          type: string
          enum: [MATERIALES, DESTAJO]
        tipo:
          type: string
          description: Tipo de movimiento del libro mayor, o `PAGO_DESTAJO`.
          examples: [ENTRADA]
        insumo:
          oneOf:
            - $ref: '#/components/schemas/InsumoResumen'
            - type: 'null'
        cantidad:
          description: Con signo, como en el libro mayor; un `AJUSTE` a la baja es negativo.
          allOf:
            - $ref: '#/components/schemas/Cantidad'
        unidad:
          $ref: '#/components/schemas/Unidad'
        importe:
          $ref: '#/components/schemas/Importe'
        motivo:
          description: Motivo del `AJUSTE`; `null` en los demás movimientos.
          type: [string, 'null']
        estado_fuente:
          $ref: '#/components/schemas/EstadoFuente'
        documento_origen:
          description: '`null` para movimientos de una fuente `SIMULADA`.'
          oneOf:
            - type: object
              required: [tipo, id, folio, ruta]
              properties:
                tipo:
                  type: string
                  examples: [ENTRADA_ALMACEN]
                id:
                  $ref: '#/components/schemas/Uuid'
                folio:
                  type: string
                ruta:
                  type: string
                  pattern: '^/'
            - type: 'null'
        responsable:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
    ListaMovimientosPartida:
      type: object
      required: [elementos, paginacion]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/MovimientoPartida'
        paginacion:
          $ref: '#/components/schemas/MetaPagina'
    AlertaSemaforo:
      type: object
      description: >-
        Solo partidas en `ROJO` con desviación **no ilustrativa**: por encima del
        umbral de su obra o, si la obra no lo tiene, con cualquier desviación
        positiva (`PA-18`).
      required: [obra, tipo_partida, desviacion, umbral_alerta_pct]
      properties:
        obra:
          $ref: '#/components/schemas/ObraResumen'
        tipo_partida:
          $ref: '#/components/schemas/TipoPartida'
        desviacion:
          $ref: '#/components/schemas/Desviacion'
        umbral_alerta_pct:
          description: '`null` si la obra no tiene umbral.'
          oneOf:
            - $ref: '#/components/schemas/Porcentaje'
            - type: 'null'
